<script>
'use strict';
// The storage KEY deliberately remains v1: upgrading the page keeps existing GitHub Pages localStorage.
const KEY='fondly.data.v1', PRE_V2_KEY='fondly.pre-v2.backup', PRE_V3_KEY='fondly.pre-v3.backup', PRE_V4_KEY='fondly.pre-v4.backup', PRE_V5_KEY='fondly.pre-v5.backup', PRE_V6_KEY='fondly.pre-v6.backup', PRE_V7_KEY='fondly.pre-v7.backup', PRE_V8_KEY='fondly.pre-v8.backup', SCHEMA=8;
const APP_VERSION='0.8.0', RELEASE_DATE='2026-09-17';
const now=()=>new Date().toISOString();
const localDate=(d=new Date())=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const localMonth=()=>localDate().slice(0,7);
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Anytime';
const ic=(name)=>`<svg class="ico" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const defaultRules=()=>({'Inner circle':14,'Close':30,'Warm':60,'Light':90,'Acquaintance':0});
const blank=()=>({app:'fondly',schemaVersion:SCHEMA,createdAt:now(),updatedAt:now(),people:[],moments:[],invitations:[],reminders:[],circles:[],events:[],goals:[],reviews:[],statusHistory:[],learnings:[],settings:{cadenceRules:defaultRules(),peopleView:defaultPeopleView(),eventView:{period:'upcoming',circle:'',order:'newest'}},extensions:{}});
// Pure v1->v2 migration: retain ALL original fields/IDs; only add new collections and optional properties.
function v1ToV2(old){const d=structuredClone(old),names=[...new Set(d.people.map(p=>typeof p.circle==='string'?p.circle.trim():'').filter(Boolean))].sort();d.circles=Array.isArray(d.circles)?d.circles:names.map((name,i)=>({id:'legacy-circle-'+i,name,createdAt:d.createdAt||now(),updatedAt:d.updatedAt||now()}));d.people=d.people.map(p=>({...p,circleIds:Array.isArray(p.circleIds)?p.circleIds:p.circle?[d.circles.find(c=>c.name===p.circle.trim())?.id].filter(Boolean):[],closeness:p.closeness||'',intention:p.intention||''}));d.moments=d.moments.map(m=>({...m,kind:m.kind||'',insight:m.insight||'',insightTopic:m.insightTopic||''}));d.reminders=d.reminders.map(r=>({...r,completedAt:r.completedAt||''}));d.events=d.events||[];d.goals=d.goals||[];d.reviews=d.reviews||[];d.settings=d.settings||{};d.extensions=d.extensions||{};d.schemaVersion=2;return d;}
// v2->v3 adds optional cadence and an explicit, non-inferred change log. Never rewrite prior moments.
function v2ToV3(old){const d=structuredClone(old);d.statusHistory=Array.isArray(d.statusHistory)?d.statusHistory:[];d.people=d.people.map(p=>({...p,cadenceDays:Number.isInteger(p.cadenceDays)?p.cadenceDays:0,nextAutoReminderAfter:p.nextAutoReminderAfter||''}));d.schemaVersion=3;return d;}
// v3 -> v4: add defaults and attendance/postmortem without interpreting planned guests as met.
function v3ToV4(old){const d=structuredClone(old);d.settings={...(d.settings||{}),cadenceRules:{...defaultRules(),...(d.settings?.cadenceRules||{})}};d.people=d.people.map(p=>({...p,cadenceMode:p.cadenceMode||((p.cadenceDays||0)>0?'override':'inherit')}));d.events=d.events.map(e=>({...e,metPersonIds:Array.isArray(e.metPersonIds)?e.metPersonIds:[],postMortem:e.postMortem&&typeof e.postMortem==='object'?e.postMortem:{overall:'',changes:'',learning:'',nextTime:'',completedAt:''}}));d.schemaVersion=4;return d;}
// v4 -> v5 adds invitation history and saved people-list preferences. Historical events/moments are unchanged.
const defaultPeopleView=()=>({sort:'recent',circle:'',closeness:'',intention:'',activity:''});
function v4ToV5(old){const d=structuredClone(old);d.invitations=Array.isArray(d.invitations)?d.invitations:[];d.settings={...(d.settings||{}),peopleView:{...defaultPeopleView(),...(d.settings?.peopleView||{})}};d.events=d.events.map(e=>({...e,status:e.status||((e.postMortem?.completedAt)?'completed':'planned')}));d.schemaVersion=5;return d;}
// v5 -> v6: add optional linkage without rewriting historical events, invitations or IDs.
function v5ToV6(old){const d=structuredClone(old);d.moments=d.moments.map(m=>({...m,invitationId:m.invitationId||''}));d.settings={...(d.settings||{}),eventView:{period:'upcoming',circle:'',order:'newest',...(d.settings?.eventView||{})}};d.schemaVersion=6;return d;}
// v6 → v7: make learnings discoverable without deleting or guessing old notes.
function v6ToV7(old){const d=structuredClone(old);d.learnings=Array.isArray(d.learnings)?d.learnings:[];
 for(const m of d.moments){if(!m.insight?.trim())continue;let scope=m.insightTopic==='myself'?'self':m.insightTopic==='them'&&m.personIds.length===1?'person':'legacy';d.learnings.push({id:'v7-moment-'+m.id,text:m.insight,scope,personId:scope==='person'?m.personIds[0]:'',eventId:m.eventId||'',momentId:m.id,sourceType:'moment',sourceId:m.id,date:m.date||'',legacy:true,createdAt:m.createdAt||d.createdAt});}
 for(const ev of d.events){if(ev.postMortem?.learning?.trim())d.learnings.push({id:'v7-event-'+ev.id,text:ev.postMortem.learning,scope:'event',personId:'',eventId:ev.id,momentId:'',sourceType:'event',sourceId:ev.id,date:ev.date||'',legacy:true,createdAt:ev.updatedAt||d.createdAt});}
 d.schemaVersion=7;return d;}
// v7 → v8: keep every record; add optional learning-review state only. Socials is a unified VIEW over existing events + moments, not a destructive rewrite.
function v7ToV8(old){const d=structuredClone(old);d.learnings=(d.learnings||[]).map(l=>({...l,reviewState:l.reviewState||'',revisitNote:l.revisitNote||'',lastReviewedAt:l.lastReviewedAt||''}));d.schemaVersion=8;return d;}
const migrations={1:v1ToV2,2:v2ToV3,3:v3ToV4,4:v4ToV5,5:v5ToV6,6:v6ToV7,7:v7ToV8};
function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.app!=='fondly')throw Error('Not a Fondly backup.');let d=structuredClone(raw);if(!Number.isInteger(d.schemaVersion)||d.schemaVersion<1)throw Error('Invalid schema version.');if(d.schemaVersion>SCHEMA)throw Error('Backup is from a newer Fondly. Please update the app first.');while(d.schemaVersion<SCHEMA){if(!migrations[d.schemaVersion])throw Error('No migration available.');d=migrations[d.schemaVersion](d)}for(const k of ['people','moments','invitations','reminders','circles','events','goals','reviews','statusHistory','learnings']){if(!Array.isArray(d[k]))throw Error('Invalid '+k+' records.');const ids=new Set();for(const r of d[k]){if(!r||typeof r!=='object'||typeof r.id!=='string'||!r.id||ids.has(r.id))throw Error('Invalid/duplicate ID in '+k);ids.add(r.id)}if(d[k].length>100000)throw Error('Backup contains too many '+k+' records.')}for(const inv of d.invitations)if(typeof inv.personId!=='string'||!inv.personId)throw Error('Invalid invitation person ID.');for(const m of d.moments)if(!Array.isArray(m.personIds))throw Error('Invalid moment person IDs.');for(const p of d.people)if(!Array.isArray(p.circleIds))throw Error('Invalid person circle IDs.');if(!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings))d.settings={};d.settings.cadenceRules={...defaultRules(),...(d.settings.cadenceRules||{})};d.settings.peopleView={...defaultPeopleView(),...(d.settings.peopleView||{})};d.settings.eventView={period:'upcoming',circle:'',order:'newest',...(d.settings.eventView||{})};return d;}
let db,loadError='',rawOnError='';
try{const s=localStorage.getItem(KEY);db=s?normalize(JSON.parse(s)):blank();}catch(e){rawOnError=localStorage.getItem(KEY)||'';loadError=e.message;db=blank();}
let navStack=[],returnScroll=0,circleAddOrigin='', tab='home',subTab='overview',selectedPerson='',selectedMoment='',selectedInvitation='',selectedCircle='',selectedEvent='',draftEventId='',mode='',search='',toast='',saveFailed=false,draftInvitationMomentId='',logReturnTab='review',activityType='all';
function persist(){if(loadError){alert('Existing data could not be read. Import a valid backup before saving.');return false;}try{const raw=localStorage.getItem(KEY);if(raw){const version=JSON.parse(raw).schemaVersion;for(const [v,key] of [[1,PRE_V2_KEY],[2,PRE_V3_KEY],[3,PRE_V4_KEY],[4,PRE_V5_KEY],[5,PRE_V6_KEY],[6,PRE_V7_KEY],[7,PRE_V8_KEY]]){if(version===v&&!localStorage.getItem(key)){try{localStorage.setItem(key,raw)}catch(e){console.warn('Optional migration snapshot unavailable; export your JSON manually.',e)}}}}db.updatedAt=now();localStorage.setItem(KEY,JSON.stringify(db));saveFailed=false;return true;}catch(e){saveFailed=true;alert('Could not save locally. Export your data from Review → Data & backup. '+e.message);return false;}}
const getPerson=id=>db.people.find(p=>p.id===id);
const pname=id=>getPerson(id)?.name||'Unknown person';
const momentPeople=m=>(m.personIds||[]).map(pname).join(', ');
const allPeople=()=>db.people.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const recentFor=id=>db.moments.filter(m=>m.personIds.includes(id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
const circleName=id=>db.circles.find(c=>c.id===id)?.name||'';
const personCircles=p=>(p.circleIds||[]).map(circleName).filter(Boolean);
const pending=()=>db.reminders.filter(r=>!r.done).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
const due=()=>pending().filter(r=>r.dueDate&&r.dueDate<=localDate());
const nextEvents=()=>db.events.filter(ev=>ev.date>=localDate()&&ev.status!=='cancelled'&&ev.status!=='completed').sort((a,b)=>a.date.localeCompare(b.date));
const followupInvitations=()=>db.invitations.filter(i=>i.followDate&&i.followDate<=localDate()&&i.nextStep==='follow'&&i.outcome!=='accepted'&&getPerson(i.personId)).sort((a,b)=>a.followDate.localeCompare(b.followDate));
const actionableInvitations=()=>db.invitations.filter(i=>getPerson(i.personId)&&(i.outcome==='pending'||(i.outcome==='accepted'&&!db.events.some(e=>e.id===i.eventId)))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const attentionPeople=()=>db.people.filter(p=>{let day=attentionDate(p.id);return day&&day<=localDate();});
function attentionReasons(id){const p=getPerson(id);if(!p)return [];let reasons=[];const today=localDate();for(const r of pending().filter(r=>r.personId===id&&r.dueDate&&r.dueDate<=today))reasons.push('Follow-up: '+r.text+' · '+fmt(r.dueDate));for(const i of followupInvitations().filter(i=>i.personId===id))reasons.push('Invitation follow-up · '+fmt(i.followDate));const last=lastMeaningfulContact(id),interval=ruleDays(p),auto=contactDueDate(id);if(last&&auto&&auto<=today&&(!p.nextAutoReminderAfter||p.nextAutoReminderAfter<=today)&&!pending().some(r=>r.personId===id&&r.dueDate&&r.dueDate<=today))reasons.push('Check-in: '+interval+'-day rule · last contact '+fmt(last.date));return reasons;}
function nextCheckin(){const today=localDate(),candidates=[...pending().filter(r=>r.dueDate&&r.dueDate>today&&getPerson(r.personId)).map(r=>({date:r.dueDate,name:pname(r.personId),kind:'follow-up'})),...db.people.flatMap(p=>{let next=contactDueDate(p.id);if(!next)return [];let shown=p.nextAutoReminderAfter&&p.nextAutoReminderAfter>today&&p.nextAutoReminderAfter>next?p.nextAutoReminderAfter:next;return shown>today?[{date:shown,name:p.name,kind:'check-in'}]:[]})].sort((a,b)=>a.date.localeCompare(b.date));return candidates[0]||null;}

const monthMoments=month=>db.moments.filter(m=>m.date&&m.date.slice(0,7)===month);
const reviewFor=month=>db.reviews.find(r=>r.month===month);
function metInMonth(month){let ids=new Set();for(const m of monthMoments(month)){if(m.kind==='inPerson'||(m.kind==='event'&&m.countsAsContact===true)){(m.personIds||[]).forEach(id=>{if(getPerson(id))ids.add(id)})}}for(const ev of db.events){if(ev.status!=='cancelled'&&(ev.date||'').slice(0,7)===month){(ev.metPersonIds||[]).forEach(id=>{if(getPerson(id))ids.add(id)})}}return ids;}
function meetupsInMonth(month){const today=localDate(),events=db.events.filter(e=>(e.date||'').slice(0,7)===month&&e.date<=today&&e.status!=='cancelled'&&(e.metPersonIds||[]).some(id=>!!getPerson(id))).length;const standalone=db.moments.filter(m=>(m.date||'').slice(0,7)===month&&m.date<=today&&!m.eventId&&(m.kind==='inPerson'||(m.kind==='event'&&m.countsAsContact===true))&&(m.personIds||[]).some(id=>!!getPerson(id))).length;return events+standalone;}
function newPeopleMetInMonth(month){const seen=metInMonth(month);return db.people.filter(p=>(p.createdAt||'').slice(0,7)===month&&seen.has(p.id)&&!db.events.some(e=>e.status!=='cancelled'&&e.date<month+'-01'&&(e.metPersonIds||[]).includes(p.id))&&!db.moments.some(m=>m.date<month+'-01'&&(m.personIds||[]).includes(p.id)&&(m.kind==='inPerson'||m.kind==='event'&&m.countsAsContact===true))).length;}
function progress(g){let mm=monthMoments(g.month);if(g.type==='meet')return metInMonth(g.month).size;if(g.type==='reach')return new Set(mm.filter(m=>m.kind==='message'||m.kind==='call').flatMap(m=>m.personIds)).size;if(g.type==='followup')return db.reminders.filter(r=>r.done&&r.completedAt&&r.completedAt.slice(0,7)===g.month).length;return g.progress||0;}
function peopleView(){return db.settings.peopleView;}
function lastContactDate(id){return lastMeaningfulContact(id)?.date||'';}
function contactDueDate(id){const p=getPerson(id);if(!p)return '';const last=lastContactDate(id),days=ruleDays(p);return last&&days>0?datePlus(last,days):'';}
function attentionDate(id){const manual=pending().filter(r=>r.personId===id&&r.dueDate).map(r=>r.dueDate).sort()[0];const invite=followupInvitations().filter(i=>i.personId===id).map(i=>i.followDate).sort()[0];const auto=contactDueDate(id),p=getPerson(id);const validAuto=auto&&(!p.nextAutoReminderAfter||p.nextAutoReminderAfter<=localDate())?auto:'';return [manual,invite,validAuto].filter(Boolean).sort()[0]||'';}
function metSince(id,start){return db.moments.some(m=>(m.personIds||[]).includes(id)&&m.date>=start&&m.date<=localDate()&&(m.kind==='inPerson'||m.kind==='event'&&m.countsAsContact===true))||db.events.some(e=>e.status!=='cancelled'&&e.date>=start&&e.date<=localDate()&&(e.metPersonIds||[]).includes(id));}
function personActivityMatches(p,activity){const today=localDate();if(activity==='metWeek')return metSince(p.id,datePlus(today,-6));if(activity==='metMonth')return metSince(p.id,today.slice(0,7)+'-01');if(activity==='never')return !db.moments.some(m=>(m.personIds||[]).includes(p.id))&&!db.invitations.some(i=>i.personId===p.id)&&!db.events.some(e=>(e.metPersonIds||[]).includes(p.id));if(activity==='due')return !!(attentionDate(p.id)&&attentionDate(p.id)<=today);return true;}
function sortPeople(list){const sort=peopleView().sort,today=localDate();const closeOrder={'Inner circle':0,'Close':1,'Warm':2,'Light':3,'Acquaintance':4};return list.sort((a,b)=>{let x=0;if(sort==='recent')x=(lastContactDate(b.id)||'').localeCompare(lastContactDate(a.id)||'');if(sort==='attention'){const da=attentionDate(a.id),dbb=attentionDate(b.id);x=(!da===!dbb?0:da?-1:1)||(da||'').localeCompare(dbb||'');}if(sort==='closeness')x=(closeOrder[a.closeness]??5)-(closeOrder[b.closeness]??5);if(sort==='added')x=(b.createdAt||'').localeCompare(a.createdAt||'');if(sort==='longest'){const da=lastContactDate(a.id),dbb=lastContactDate(b.id);x=(!!da===!!dbb?0:da?-1:1)||da.localeCompare(dbb);}return x||(a.name||'').localeCompare(b.name||'');});}
function invitationRow(inv){return `<div class="rowcard clickable" data-invitation="${esc(inv.id)}" role="button" tabindex="0"><div class="grow"><div class="meta">${fmt(inv.date)} · Invitation · ${esc(pname(inv.personId))}</div><strong>${esc(inv.outcome?outcomeLabel[inv.outcome]||inv.outcome:'Awaiting reply')}</strong><div class="detail sm">${esc(inv.note||'Invitation sent')}</div>${inv.learning?`<div class="meta">✦ ${esc(inv.learning)}</div>`:''}</div>${ic('chevron')}</div>`;}
function personRow(p){let last=lastMeaningfulContact(p.id),recent=recentFor(p.id),dueDate=attentionDate(p.id),isDue=dueDate&&dueDate<=localDate();let lastLabel=last?'Contact '+fmt(last.date):recent?'Last note '+fmt(recent.date):'No contact logged';return `<div class="rowcard clickable" data-person="${esc(p.id)}" role="button" tabindex="0"><div class="avatar">${esc((p.name||'?').trim()[0])}</div><div class="grow"><strong>${esc(p.name)}</strong><div class="meta ellipsis">${esc(p.closeness||'Not set')} · ${esc(personCircles(p).join(' · ')||'No circle')}</div><div class="meta">${esc(lastLabel)}</div>${isDue?`<div class="meta" style="color:var(--red)">${esc(attentionReasons(p.id).slice(0,2).join(' · ')||'Check-in due')}</div>`:''}</div>${isDue?'<span class="pill rose">Due</span>':''}${ic('chevron')}</div>`;}
function momentRow(m){return `<div class="rowcard clickable" data-moment="${esc(m.id)}" role="button" tabindex="0"><div class="grow"><div class="meta">${fmt(m.date)} · ${esc(momentPeople(m))} ${m.kind?'· '+esc(kindLabel(m.kind)):''}</div><div class="ellipsis">${esc(m.text)}</div>${m.insight?`<div class="meta">✦ ${esc(m.insight)}</div>`:''}</div>${ic('chevron')}</div>`;}
const kindLabel=k=>({inPerson:'In person',call:'Call',message:'Message',event:'Event',other:'Other'})[k]||'Not categorized';
const outcomeLabel={pending:'Awaiting reply',accepted:'Accepted',unavailable:'Unavailable',declined:'Declined',rescheduled:'Rescheduled'};
const nextStepLabel={follow:'Try again later',natural:'Let it unfold',pause:'Pause invitations'};
const closeOpts=['','Inner circle','Close','Warm','Light','Acquaintance'];

function learningSource(l){if(l.sourceType==='person'&&l.sourceId&&getPerson(l.sourceId))return `<button class="btn tiny-btn subtle" data-person="${esc(l.sourceId)}">Person profile →</button>`;if(l.momentId&&db.moments.some(m=>m.id===l.momentId))return `<button class="btn tiny-btn subtle" data-moment="${esc(l.momentId)}">Original conversation →</button>`;if(l.eventId&&db.events.some(ev=>ev.id===l.eventId))return `<button class="btn tiny-btn subtle" data-event="${esc(l.eventId)}">Original social →</button>`;return '<span class="meta">Original record no longer available</span>';}
function learningItem(l){return `<div class="card learning-item"><div class="meta">${fmt(l.date)} · ${esc(learningScopeName(l.scope))}</div><div class="detail sm">${esc(l.text)}</div><div class="buttons" style="margin-top:6px">${learningSource(l)}<button class="btn tiny-btn" data-action="editLearning" data-id="${esc(l.id)}">Edit / move</button></div></div>`;}
function learningForPerson(id){return db.learnings.filter(l=>l.scope==='person'&&l.personId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
const insightTopicLabel=k=>({them:'About them',myself:'About myself',conversation:'Conversation ideas',patterns:'Relationship patterns',other:'Other'})[k]||'Uncategorized';
const intentOpts=['','Get to know better','Keep in touch','Maintain lightly','Take a pause'];
const opt=(values,current)=>values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v||'Not set')}</option>`).join('');
// 200 original, distinct encouragements; rotated by local calendar day through a stable shuffled deck.

function datePlus(date,days){const x=new Date(date+'T12:00:00Z');if(Number.isNaN(x.getTime()))return '';x.setUTCDate(x.getUTCDate()+days);return x.toISOString().slice(0,10)}
function ruleDays(p){if(p.cadenceMode==='off')return 0;if(p.cadenceMode==='override')return Number(p.cadenceDays||0);return Number(db.settings.cadenceRules[p.closeness]||0)}
function qualifiesAsContact(m){return m.countsAsContact===true||(m.countsAsContact===undefined&&['inPerson','call','message'].includes(m.kind))}
function lastMeaningfulContact(id){return db.moments.filter(m=>(m.personIds||[]).includes(id)&&m.date&&qualifiesAsContact(m)&&m.date<=localDate()).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function autoSuggestions(){const today=localDate();return db.people.flatMap(p=>{const days=ruleDays(p);if(!Number.isInteger(days)||days<1||days>365)return [];const last=lastMeaningfulContact(p.id);if(!last?.date)return [];const next=datePlus(last.date,days);if(!next||next>today||(p.nextAutoReminderAfter||'')>today)return [];if(pending().some(r=>r.personId===p.id&&r.dueDate&&r.dueDate<=today))return [];return [{person:p,last:last.date,next,days}]}).sort((a,b)=>a.next.localeCompare(b.next));}
function historyForPerson(id){return db.statusHistory.filter(h=>h.personId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''))}
function eventName(id){return db.events.find(e=>e.id===id)?.name||''}
function eventForHistory(h){return h.eventId||(h.momentId?db.moments.find(m=>m.id===h.momentId)?.eventId:'')||''}
function statusChangeHTML(h){let eid=eventForHistory(h);let source=h.momentId?`<button class="btn tiny-btn" data-moment="${esc(h.momentId)}">Moment →</button>`:'<span class="meta">Profile edit</span>';return `<div class="status-line"><div class="meta">${fmt(h.date)} ${eid&&eventName(eid)?`· <button class="btn tiny-btn subtle" data-event="${esc(eid)}">${esc(eventName(eid))} →</button>`:''}</div>${(h.changes||[]).map(c=>`<div><strong>${esc(c.field==='closeness'?'Closeness':'Intention')}</strong>: ${esc(c.from||'Not set')} → ${esc(c.to||'Not set')}</div>`).join('')}${h.reason?`<div class="detail">${esc(h.reason)}</div>`:''}<div style="margin-top:3px">${source}</div></div>`;}
function recordStatus(person,values,source,date,momentId='',reason=''){const changes=[];for(const field of ['closeness','intention']){if(!Object.prototype.hasOwnProperty.call(values,field))continue;const from=person[field]||'',to=values[field]||'';if(from!==to){changes.push({field,from,to});person[field]=to;}}if(changes.length){const eventId=momentId?db.moments.find(m=>m.id===momentId)?.eventId||'':'';db.statusHistory.push({id:uid(),personId:person.id,momentId,eventId,source,date,changes,reason:String(reason||'').trim(),createdAt:now()});person.updatedAt=now();}return changes.length;}
function dayNumber(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function dailyQuote(){let seed=2166136261;for(const c of db.createdAt||'fondly')seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;const a=encouragements.map((_,i)=>i);for(let i=a.length-1;i>0;i--){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;let j=(seed>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return encouragements[a[dayNumber()%a.length]];}
function captureView(){return {tab,subTab,selectedPerson,selectedMoment,selectedInvitation,selectedCircle,selectedEvent,draftEventId,draftInvitationMomentId,mode,scrollY:window.scrollY||0};}
function pushView(){navStack.push(captureView());if(navStack.length>24)navStack.shift();}
function backTo(fallback){if(navStack.length){let prev=navStack.pop();({tab,subTab,selectedPerson,selectedMoment,selectedInvitation,selectedCircle,selectedEvent,draftEventId,draftInvitationMomentId,mode}=prev);render();window.scrollTo(0,prev.scrollY||0);return;}fallback();render();window.scrollTo(0,0);}
function go(t){navStack=[];tab=t;mode='';selectedPerson='';selectedMoment='';selectedInvitation='';selectedCircle='';selectedEvent='';toast='';render();window.scrollTo(0,0)}
function msg(text){toast=text;render()}

function personDetail(){let p=getPerson(selectedPerson);if(!p){selectedPerson='';return peoplePage()}let moments=db.moments.filter(m=>m.personIds.includes(p.id)).sort((a,b)=>b.date.localeCompare(a.date));let rem=pending().filter(r=>r.personId===p.id);return `<div class="wrap"><button class="back" data-action="backPeople">← All people</button><div class="heading"><div style="display:flex;gap:9px;align-items:center"><div class="avatar" style="width:45px;height:45px;font-size:23px">${esc(p.name[0]||'?')}</div><div><h1>${esc(p.name)}</h1><div>${personCircles(p).map(c=>`<span class="pill">${esc(c)}</span>`).join('')||'<span class="meta">No circle</span>'}</div></div></div><div class="buttons"><button class="btn tiny-btn" data-action="editPerson">Edit</button><button class="btn tiny-btn" data-action="inviteForPerson">+ Invite</button><button class="btn tiny-btn primary" data-action="momentForPerson">+ Log</button></div></div><div class="buttons" style="margin-bottom:10px">${p.closeness?`<span class="pill">${esc(p.closeness)}</span>`:''}${p.intention?`<span class="pill green">${esc(p.intention)}</span>`:''}</div><div class="two"><div><section class="card"><h3>Remember</h3>${[['How we met',p.howMet],['Contact',p.contact],['Family & connections',p.family],['Notes',p.notes]].map(([k,v])=>`<div style="margin:0 0 9px"><div class="meta">${k}</div><div class="detail sm">${esc(v||'—')}</div></div>`).join('')}</section><section class="card"><div class="sectionhead"><h3>Follow-ups</h3><button class="btn tiny-btn" data-action="reminderForPerson">+ Reminder</button></div>${rem.length?rem.map(reminderRow).join(''):'<div class="meta">No open follow-ups.</div>'}</section></div><section><div class="sectionhead"><h2>Conversations together</h2><span class="meta">${moments.length} records</span></div>${moments.length?`<div class="list">${moments.map(momentRow).join('')}</div>`:'<div class="empty">No conversations logged.</div>'}</section></div><div class="section"><div class="sectionhead"><h2>Things I remember about ${esc(p.name)}</h2><button class="btn tiny-btn primary" data-action="addLearning" data-source="person">+ Remember</button></div><p class="meta">Only notes you explicitly saved about this person. Tap the original conversation to see where it came from.</p>${learningForPerson(p.id).map(learningItem).join('')||'<div class="empty">No person notes yet. Add a memory here or from a conversation.</div>'}</div><div class="section"><div class="sectionhead"><h2>Invitations</h2><button class="btn tiny-btn" data-action="inviteForPerson">+ Invite</button></div>${db.invitations.filter(i=>i.personId===p.id).length?`<div class="list">${db.invitations.filter(i=>i.personId===p.id).sort((a,b)=>b.date.localeCompare(a.date)).map(invitationRow).join('')}</div>`:'<div class="empty">No invitations logged yet.</div>'}</div><div class="section"><div class="sectionhead"><h2>Connection notes from events</h2></div>${db.events.filter(ev=>ev.postMortem?.changeNote?.trim()&&ev.postMortem?.changePersonId===p.id).map(ev=>`<div class="card"><button class="btn tiny-btn" data-event="${esc(ev.id)}">${esc(ev.name)} · ${fmt(ev.date)} →</button><div class="detail sm">${esc(ev.postMortem.changeNote)}</div></div>`).join('')||'<p class="meta">No notes about a change yet.</p>'}</div><div class="section"><div class="sectionhead"><h2>Relationship changes</h2><span class="meta">Only changes you recorded</span></div>${historyForPerson(p.id).length?`<div class="status-history">${historyForPerson(p.id).map(statusChangeHTML).join('')}</div>`:'<div class="meta">No changes recorded yet. You can record one after a moment, or when editing this profile.</div>'}</div>${autoSuggestions().some(s=>s.person.id===p.id)?`<div class="section card sage"><strong>Check-in due</strong><div class="meta">${esc(attentionReasons(p.id).join(' · '))}</div><div class="buttons" style="margin-top:7px"><button class="btn tiny-btn" data-action="logForAuto" data-id="${esc(p.id)}">Add contact note</button><button class="btn tiny-btn" data-action="autoSnooze" data-id="${esc(p.id)}">Next week</button><button class="btn tiny-btn" data-action="autoOff" data-id="${esc(p.id)}">Off</button></div></div>`:''}<div class="section"><button class="btn danger tiny-btn" data-action="deletePerson">Delete this person</button></div></div>`;}
function logPage(){if(mode==='invitationForm')return invitationForm();if(mode==='momentForm')return momentForm();if(selectedMoment)return momentDetail();if(selectedInvitation)return invitationDetail();let activity=[...db.moments.map(m=>({date:m.date||'',createdAt:m.createdAt||'',html:momentRow(m)})),...db.invitations.map(i=>({date:i.date||'',createdAt:i.createdAt||'',html:invitationRow(i)}))].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return `<div class="wrap">${pageHeading('COLLECT THE LITTLE THINGS','Log',`<div class="buttons"><button class="btn tiny-btn" data-action="newInvitation">+ Invite</button><button class="btn tiny-btn primary" data-action="newMoment">${ic('plus')} Conversation</button></div>`)}<p class="muted sm">Add conversation note after coffee, a run, or a quick chat. Create an Event only to plan or recap a gathering. Invitations are separate and do not count as meetings.</p>${activity.length?`<div class="list">${activity.map(a=>a.html).join('')}</div>`:'<div class="empty">Add conversation note or an invitation to begin.</div>'}</div>`;}
function peopleChecks(ids=[]){return `<div class="people-picker" data-people-picker data-selected="${esc(JSON.stringify(ids))}"><div class="picker-controls"><input type="search" class="picker-search" placeholder="Search names or notes…" aria-label="Search participants" autocomplete="off"><select class="picker-circle" aria-label="Filter participants by circle"><option value="">All circles</option>${db.circles.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div class="picker-meta" aria-live="polite"></div><div class="picker-chips"></div><div class="picker-actions"><button type="button" class="btn tiny-btn picker-add-visible">+ Add visible</button><button type="button" class="btn tiny-btn subtle" data-action="quickAddPerson">+ New person</button><button type="button" class="btn tiny-btn subtle picker-clear">Clear</button></div><div class="picker-choices" role="group" aria-label="People search results"></div><div class="picker-hidden"></div></div>`;}
function refreshPeoplePicker(node){if(!node)return;const selected=node._selected||new Set();let q=node.querySelector('.picker-search').value.toLowerCase().trim(),c=node.querySelector('.picker-circle').value;let matching=allPeople().filter(p=>(!c||(p.circleIds||[]).includes(c))&&(!q||(p.name+' '+(p.notes||'')+' '+personCircles(p).join(' ')).toLowerCase().includes(q)));node._visible=matching.slice(0,35).map(p=>p.id);node.querySelector('.picker-meta').textContent=`${selected.size} selected · ${matching.length} matching${matching.length>35?' · showing first 35, search to narrow':''}`;node.querySelector('.picker-choices').innerHTML=matching.slice(0,35).map(p=>`<label><input type="checkbox" class="picker-check" value="${esc(p.id)}" ${selected.has(p.id)?'checked':''}><span>${esc(p.name)} <span class="meta">${esc(personCircles(p).join(', '))}</span></span></label>`).join('')||'<div class="empty">No people found. Try another search or circle.</div>';node.querySelector('.picker-chips').innerHTML=[...selected].map(id=>getPerson(id)).filter(Boolean).map(p=>`<button type="button" class="picker-chip" data-remove-person="${esc(p.id)}">${esc(p.name)} ×</button>`).join('');node.querySelector('.picker-hidden').innerHTML=[...selected].filter(id=>!!getPerson(id)).map(id=>`<input type="hidden" name="personIds" value="${esc(id)}">`).join('');refreshStatusSubject(node.closest('form'));refreshFollowupSubject(node.closest('form'));}
function refreshStatusSubject(form){if(!form)return;let box=form.querySelector('#statusSubject');if(!box)return;let ids=[...(form.querySelector('[data-people-picker]')?._selected||[])],select=box.querySelector('select[name="statusPersonId"]'),old=select.value;let chosen=ids.includes(old)?old:(ids.length===1?ids[0]:'');select.innerHTML='<option value="">'+(ids.length>1?'Choose one participant (optional)':'No one selected')+'</option>'+ids.map(id=>`<option value="${esc(id)}" ${id===chosen?'selected':''}>${esc(pname(id))}</option>`).join('');let p=getPerson(chosen);box.querySelector('.status-current').textContent=p?`Current: ${p.closeness||'No closeness'} · ${p.intention||'No intention'}`:'Optional: select someone above to record a change.';box.querySelectorAll('.status-update').forEach(el=>{el.disabled=!p});}
function refreshFollowupSubject(form){if(!form)return;let select=form.querySelector('select[name="followPersonId"]');if(!select)return;let ids=[...(form.querySelector('[data-people-picker]')?._selected||[])];let old=select.value,chosen=ids.includes(old)?old:(ids.length===1?ids[0]:'');select.innerHTML='<option value="">'+(ids.length>1?'Choose a person if you add a follow-up':'Choose a person')+'</option>'+ids.map(id=>`<option value="${esc(id)}" ${id===chosen?'selected':''}>${esc(pname(id))}</option>`).join('');}
function bindPeoplePickers(){document.querySelectorAll('[data-people-picker]').forEach(node=>{let ids=[];try{ids=JSON.parse(node.dataset.selected||'[]')}catch{}node._selected=new Set(ids.filter(id=>!!getPerson(id)));refreshPeoplePicker(node);node.querySelector('.picker-search').addEventListener('input',()=>refreshPeoplePicker(node));node.querySelector('.picker-circle').addEventListener('change',()=>refreshPeoplePicker(node));node.querySelector('.picker-choices').addEventListener('change',e=>{if(!e.target.matches('.picker-check'))return;if(e.target.checked)node._selected.add(e.target.value);else node._selected.delete(e.target.value);refreshPeoplePicker(node)});node.querySelector('.picker-add-visible').addEventListener('click',()=>{node._visible.forEach(id=>node._selected.add(id));refreshPeoplePicker(node)});node.querySelector('.picker-clear').addEventListener('click',()=>{node._selected.clear();refreshPeoplePicker(node)});node.querySelector('.picker-chips').addEventListener('click',e=>{let b=e.target.closest('[data-remove-person]');if(b){node._selected.delete(b.dataset.removePerson);refreshPeoplePicker(node)}});});const status=document.querySelector('#statusSubject select[name="statusPersonId"]');if(status)status.addEventListener('change',()=>{let box=status.closest('#statusSubject'),p=getPerson(status.value);box.querySelector('.status-current').textContent=p?`Current: ${p.closeness||'No closeness'} · ${p.intention||'No intention'}`:'Choose a participant to record a change.';box.querySelectorAll('.status-update').forEach(el=>{el.disabled=!p});});}

function invitationForm(){const inv=selectedInvitation?db.invitations.find(i=>i.id===selectedInvitation):null;return `<div class="wrap"><button class="back" data-action="cancelInvitation">← Back</button>${pageHeading('REACH OUT, WITHOUT THE SCORE',''+(inv?'Edit invitation':'New invitation'))}<form id="invitationForm" class="card form"><div class="fields"><div class="field full"><label class="label">Who did you invite? *</label><select name="personId" required><option value="">Choose person</option>${allPeople().map(p=>`<option value="${esc(p.id)}" ${(inv?.personId||selectedPerson)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="meta">Add a person in People first. One invitation is linked to one person.</div></div><div class="field"><label class="label">Date *</label><input name="date" type="date" required value="${esc(inv?.date||localDate())}"></div><div class="field"><label class="label">Response</label><select name="outcome">${Object.entries(outcomeLabel).map(([k,t])=>`<option value="${k}" ${(inv?.outcome||'pending')===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field full"><label class="label">What happened? · optional</label><textarea name="note" maxlength="6000" placeholder="Invited her for coffee; she said this week is busy…">${esc(inv?.note||'')}</textarea></div><div class="field"><label class="label">My next step</label><select name="nextStep">${Object.entries(nextStepLabel).map(([k,t])=>`<option value="${k}" ${(inv?.nextStep||'natural')===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label class="label">Revisit on · optional</label><input type="date" name="followDate" value="${esc(inv?.followDate||'')}"></div><div class="field full"><label class="label">What did I learn or notice? · optional</label><textarea name="learning" maxlength="4000" placeholder="Only record what actually happened and how I felt; don't guess motives.">${esc(inv?.learning||'')}</textarea></div></div><p class="meta">A declined invitation is not a verdict on the relationship. It does not count as meeting, reset check-in timers, or change closeness automatically. Follow-up dates appear in Home.</p><div class="buttons"><button type="submit" class="btn primary">Save invitation</button><button type="button" class="btn" data-action="cancelInvitation">Cancel</button></div></form></div>`;}
function invitationDetail(){let inv=db.invitations.find(i=>i.id===selectedInvitation);if(!inv){selectedInvitation='';return logPage()}return `<div class="wrap"><button class="back" data-action="cancelInvitation">← Back</button>${pageHeading('INVITATION',esc(pname(inv.personId)),`<button class="btn tiny-btn" data-action="editInvitation">Edit</button>`)}<div class="card"><div class="meta">${fmt(inv.date)} · Invitation</div><h3 style="margin-top:7px">${esc(outcomeLabel[inv.outcome]||'Awaiting reply')}</h3>${inv.note?`<div class="detail">${esc(inv.note)}</div>`:''}<div class="meta" style="margin-top:9px">Next step: ${esc(nextStepLabel[inv.nextStep]||'Let it unfold')}${inv.followDate?' · '+fmt(inv.followDate):''}</div>${inv.learning?`<hr class="divider"><h3>What I noticed</h3><div class="detail">${esc(inv.learning)}</div>`:''}${inv.eventId&&eventName(inv.eventId)?`<hr class="divider"><button class="btn tiny-btn" data-event="${esc(inv.eventId)}">Social: ${esc(eventName(inv.eventId))} →</button>`:''}</div>${db.moments.some(m=>m.invitationId===inv.id)?`<div class="card"><h3>Linked moments</h3>${db.moments.filter(m=>m.invitationId===inv.id).map(momentRow).join('')}</div>`:''}<div class="buttons"><button class="btn tiny-btn" data-person="${esc(inv.personId)}">Person →</button><button class="btn tiny-btn" data-action="momentFromInvitation">+ Log conversation from invitation</button>${inv.outcome==='accepted'&&!inv.eventId?`<button class="btn primary tiny-btn" data-action="eventFromInvitation">+ Social from invitation</button>`:''}<button class="btn danger tiny-btn" data-action="deleteInvitation">Delete invitation</button></div></div>`;}
function saveInvitation(e){e.preventDefault();const f=new FormData(e.target),personId=String(f.get('personId')||''),date=String(f.get('date')||''),outcome=String(f.get('outcome')||'pending'),nextStep=String(f.get('nextStep')||'natural');if(!getPerson(personId)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!outcomeLabel[outcome]||!nextStepLabel[nextStep]){alert('Choose a person, date, response and next step.');return;}const changes={personId,date,outcome,nextStep,note:String(f.get('note')||'').trim(),learning:String(f.get('learning')||'').trim(),followDate:String(f.get('followDate')||'')};let inv=selectedInvitation?db.invitations.find(x=>x.id===selectedInvitation):null;if(inv)Object.assign(inv,changes,{updatedAt:now()});else{selectedInvitation=uid();db.invitations.push({id:selectedInvitation,createdAt:now(),updatedAt:now(),eventId:'',...changes});}if(persist()){mode='';tab='review';subTab='activity';msg('Invitation saved. No meeting was counted.');}}
function momentForm(){let m=selectedMoment?db.moments.find(x=>x.id===selectedMoment):{},ev=draftEventId?db.events.find(e=>e.id===draftEventId):m.id&&m.eventId?db.events.find(e=>e.id===m.eventId):null;let sourceInv=draftInvitationMomentId?db.invitations.find(i=>i.id===draftInvitationMomentId):m.invitationId?db.invitations.find(i=>i.id===m.invitationId):null;let initialIds=m.personIds||(sourceInv?[sourceInv.personId]:(ev?[]:(selectedPerson?[selectedPerson]:[])));let statusBox=m.id?'':`<div class="field full" id="statusSubject"><h3>Did a relationship change? · optional</h3><div class="meta">Choose the person whose closeness or intention changed. Nothing is inferred.</div><select name="statusPersonId" aria-label="Person whose relationship changed"><option value="">Choose someone (optional)</option></select><div class="meta status-current" style="margin:6px 0">Choose a participant above.</div><div class="fields"><div class="field"><label class="label">Closeness afterward</label><select class="status-update" name="newCloseness" disabled><option value="">Keep current</option>${closeOpts.slice(1).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}<option value="__clear__">Clear closeness</option></select></div><div class="field"><label class="label">Intention afterward</label><select class="status-update" name="newIntention" disabled><option value="">Keep current</option>${intentOpts.slice(1).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}<option value="__clear__">Clear intention</option></select></div><div class="field full"><label class="label">Why? · optional</label><input class="status-update" name="changeReason" maxlength="500" disabled placeholder="What changed for me?"></div></div></div>`;let count=m.countsAsContact===true||(m.countsAsContact===undefined&&!ev&&['inPerson','call','message'].includes(m.kind));return `<div class="wrap"><button class="back" data-action="cancelMoment">← ${ev?'Event':'Moments'}</button>${pageHeading('ONE SENTENCE IS ENOUGH',m.id?'Edit conversation':'Add conversation note')}${ev?`<div class="notice ok">Saved inside <strong>${esc(ev.name)}</strong>. Log only the people you actually spoke to. This is the same conversation record, not a second event.</div>`:''}${sourceInv?`<div class="notice ok">Following your invitation to <strong>${esc(pname(sourceInv.personId))}</strong>. The original invitation will stay in your history.</div>`:''}<form id="momentForm" class="card form"><div class="fields"><div class="field full"><label class="label">Who did you talk with? *</label>${peopleChecks(initialIds)}<div class="meta">Search, filter, select multiple people, or add someone new without leaving.</div></div><div class="field"><label class="label">Date *</label><input name="date" type="date" required value="${esc(m.date||ev?.date||localDate())}"></div><div class="field"><label class="label">Interaction type</label><select name="kind">${[['inPerson','Met in person · walk / run / coffee'],['call','Call'],['message','Message'],['other','Other'],...(m.kind==='event'?[['event','Older social-type record']]:[])].map(([v,n])=>`<option value="${v}" ${(m.kind||'inPerson')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field full"><label class="choice"><input name="countsAsContact" type="checkbox" value="yes" ${count?'checked':''}>Meaningful contact · reset check-in timer for selected people</label><div class="meta">A quick hello or an invitation alone need not count. Existing uncategorized records are not guessed.</div></div><div class="field full"><label class="label">What happened? *</label><textarea name="text" required maxlength="20000" placeholder="We chatted about…">${esc(m.text||'')}</textarea></div><div class="field"><label class="label">How did it feel? · private</label><select name="feeling">${opt(['','Lovely','Good','Neutral','Draining','Mixed'],m.feeling||'')}</select></div><div class="field full"><div class="notice ok">Want to remember a fact or discovery? Save this conversation first, then tap <b>+ Remember something</b>. You'll choose whether it belongs to a person, this event or yourself.</div></div><div class="field full"><label class="label">Anything else? · optional</label><textarea name="reflection">${esc(m.reflection||'')}</textarea></div>${statusBox}</div><hr class="divider"><h3>Optional follow-up</h3><div class="fields"><div class="field full"><label class="label">Who is the follow-up about?</label><select name="followPersonId"><option value="">Choose participant</option></select></div><div class="field"><label class="label">Remember to…</label><input name="followText" maxlength="300" placeholder="Ask about her move…"></div><div class="field"><label class="label">Reminder date</label><input name="followDate" type="date"></div></div><p class="meta">Reminders are in-app while open; no background phone push.</p><div class="buttons"><button type="submit" class="btn primary" ${db.people.length?'':'disabled'}>Save conversation</button><button type="button" class="btn" data-action="cancelMoment">Cancel</button></div></form></div>`;}
function momentDetail(){let m=db.moments.find(x=>x.id===selectedMoment);if(!m){selectedMoment='';return logPage()}return `<div class="wrap"><button class="back" data-action="backMoments">← Back</button><div class="heading"><div><div class="eyebrow">${fmt(m.date)} · ${esc(kindLabel(m.kind))}</div><h1>${esc(momentPeople(m))}</h1></div><button class="btn tiny-btn" data-action="editMoment">Edit</button></div>${m.eventId&&eventName(m.eventId)?`<button class="btn tiny-btn subtle" data-event="${esc(m.eventId)}">${ic('calendar')} ${esc(eventName(m.eventId))} →</button>`:''}${m.invitationId&&db.invitations.some(i=>i.id===m.invitationId)?`<button class="btn tiny-btn subtle" data-invitation="${esc(m.invitationId)}">Linked invitation →</button>`:''}<div class="card" style="margin-top:8px"><h3>What happened</h3><div class="detail">${esc(m.text)}</div><div class="meta" style="margin-top:8px">Check-in timer: ${qualifiesAsContact(m)?'counts as contact':'does not reset'}</div>${m.feeling?`<hr class="divider"><div class="meta">Feeling · ${esc(m.feeling)}</div>`:''}${m.reflection?`<hr class="divider"><h3>Private reflection</h3><div class="detail">${esc(m.reflection)}</div>`:''}${db.statusHistory.some(h=>h.momentId===m.id)?`<hr class="divider"><h3>Relationship changes</h3>${db.statusHistory.filter(h=>h.momentId===m.id).map(statusChangeHTML).join('')}`:''}</div><div class="section"><div class="sectionhead"><h2>Things to remember</h2><button class="btn tiny-btn primary" data-action="addLearning" data-source="moment">+ Remember something</button></div><p class="meta">Choose Person, Event or Me when saving. The note will be visible in the chosen place.</p>${db.learnings.filter(l=>l.momentId===m.id).map(learningItem).join('')||'<div class="empty">No notes saved from this conversation yet.</div>'}</div><button class="btn danger tiny-btn" data-action="deleteMoment">Delete moment</button></div>`;}
function circlesPage(){if(mode==='circleForm')return circleForm();if(selectedCircle)return circleDetail();const circles=db.circles.slice().sort((a,b)=>a.name.localeCompare(b.name));return `<div class="wrap">${pageHeading('YOUR GROUPS','Circles',`<button class="btn primary tiny-btn" data-action="newCircle">${ic('plus')} Circle</button>`)}<p class="meta">Organize people by where you know them. Events have their own tab.</p>${circles.length?`<div class="list" style="gap:5px">${circles.map(c=>`<div class="rowcard circle-compact clickable" data-circle="${esc(c.id)}" role="button" tabindex="0"><div class="grow"><strong>${esc(c.name)}</strong></div><span class="meta">${db.people.filter(p=>(p.circleIds||[]).includes(c.id)).length} people</span>${ic('chevron')}</div>`).join('')}</div>`:'<div class="empty">Create a circle such as School, Hockey or Old friends.</div>'}</div>`;}
function circleForm(){let c=selectedCircle?db.circles.find(x=>x.id===selectedCircle):{};return `<div class="wrap"><button class="back" data-action="cancelCircle">← Circles</button>${pageHeading('ORGANIZE YOUR PEOPLE',c.id?'Edit circle':'New circle')}<form id="circleForm" class="card form"><div class="field"><label class="label">Circle name *</label><input name="name" required maxlength="120" value="${esc(c.name||'')}" placeholder="e.g. School parents"></div><div class="field" style="margin-top:10px"><label class="label">Notes (optional)</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><div class="buttons"><button type="submit" class="btn primary">Save circle</button><button type="button" class="btn" data-action="cancelCircle">Cancel</button></div></form></div>`;}
function circleDetail(){let c=db.circles.find(x=>x.id===selectedCircle);if(!c){selectedCircle='';return circlesPage()}let ppl=allPeople().filter(p=>(p.circleIds||[]).includes(c.id));return `<div class="wrap"><button class="back" data-action="backCircles">← Circles</button>${pageHeading('YOUR CIRCLE',esc(c.name),`<div class="buttons"><button class="btn tiny-btn" data-action="editCircle">Edit</button><button class="btn tiny-btn primary" data-action="addCirclePeople">+ Add people</button></div>`)}${c.notes?`<div class="note">${esc(c.notes)}</div>`:''}<div class="sectionhead section"><h2>People · ${ppl.length}</h2></div>${ppl.length?`<div class="list">${ppl.map(p=>`<div class="rowcard"><div class="avatar">${esc((p.name||'?')[0])}</div><div class="grow"><strong>${esc(p.name)}</strong><div class="meta">${esc(p.closeness||'No closeness')}</div></div><button class="btn tiny-btn" data-person="${esc(p.id)}">Open →</button><button class="btn tiny-btn subtle" data-action="removeCirclePerson" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)} from this circle only">Remove</button></div>`).join('')}</div>`:'<div class="empty">No one here yet. Add an existing person or create a new one.</div>'}<div class="section"><button class="btn tiny-btn primary" data-action="addCirclePeople">+ Add people to ${esc(c.name)}</button></div><div class="section"><button class="btn tiny-btn danger" data-action="deleteCircle">Delete circle (keep people)</button></div></div>`;}
function personPrepRow(p){let m=recentFor(p.id);return `<div class="prepperson"><div class="buttons" style="justify-content:space-between"><strong>${esc(p.name)}</strong><button class="btn tiny-btn" data-person="${esc(p.id)}">Profile →</button></div><div class="meta">${esc(p.closeness||'No closeness set')} ${p.family?'· '+esc(p.family.slice(0,120)):''}</div>${p.notes?`<div class="sm detail">Remember: ${esc(p.notes.slice(0,230))}</div>`:''}<div class="sm detail" style="margin-top:4px">${m?`Last ${fmt(m.date)}: ${esc(m.text.slice(0,240))}`:'No recorded interactions yet.'}</div>${m?.insight?`<div class="meta">✦ ${esc(m.insight.slice(0,180))}</div>`:''}</div>`;}
function eventForm(){let e=selectedEvent?db.events.find(x=>x.id===selectedEvent):{},inv=draftInvitationId?db.invitations.find(i=>i.id===draftInvitationId):null,ids=e.personIds||(inv?[inv.personId]:(selectedCircle?db.people.filter(p=>(p.circleIds||[]).includes(selectedCircle)).map(p=>p.id):[]));return `<div class="wrap"><button class="back" data-action="cancelEvent">← Socials</button>${pageHeading('ONE PLACE FOR PLANS + MEMORIES',e.id?'Edit social':'New social')}<form id="eventForm" class="card form"><div class="fields"><div class="field"><label class="label">What are you doing? *</label><input name="name" maxlength="150" required value="${esc(e.name||'')}" placeholder="Coffee with Amber / school party / morning run"></div><div class="field"><label class="label">Date *</label><input name="date" type="date" required value="${esc(e.date||localDate())}"></div><div class="field"><label class="label">Status</label><select name="status">${[['planned','Planned'],['completed','Completed'],['cancelled','Cancelled']].map(([k,t])=>`<option value="${k}" ${(e.status||'planned')===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field full"><label class="label">Circle · optional</label><select name="circleId"><option value="">No circle</option>${db.circles.map(c=>`<option value="${esc(c.id)}" ${(e.circleId||selectedCircle)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label class="label">Who will be there? · one person or many</label>${peopleChecks(ids)}</div><div class="field full"><p class="meta">A Social can be a run with one friend or a big gathering. Plan it here, then add what happened afterward.</p></div><div class="field full"><label class="label">Notes / context · optional</label><textarea name="notes">${esc(e.notes||'')}</textarea></div></div><div class="buttons"><button class="btn primary" type="submit">Save social</button><button class="btn" type="button" data-action="cancelEvent">Cancel</button></div></form></div>`;}
function eventDetail(){let ev=db.events.find(e=>e.id===selectedEvent);if(!ev){selectedEvent='';return eventsPage()}let peopleIds=[...new Set([...(ev.personIds||[]),...(ev.metPersonIds||[])])],people=peopleIds.map(getPerson).filter(Boolean);let moments=db.moments.filter(m=>m.eventId===ev.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),pm=ev.postMortem||{};return `<div class="wrap"><button class="back" data-action="backEvents">← Socials</button><div class="heading"><div><div class="eyebrow">${fmt(ev.date)} · ${esc((ev.status||'planned').toUpperCase())} SOCIAL</div><h1>${esc(ev.name)}</h1></div><button class="btn tiny-btn" data-action="editEvent">Edit</button></div>${ev.notes?`<div class="note detail">${esc(ev.notes)}</div>`:''}<div class="stats" style="margin:10px 0"><div class="stat"><div class="num">${(ev.personIds||[]).length}</div><div class="meta">Expected</div></div><div class="stat"><div class="num">${(ev.metPersonIds||[]).length}</div><div class="meta">Confirmed met</div></div><div class="stat"><div class="num">${moments.length}</div><div class="meta">Notes</div></div></div><div class="sectionhead"><h2>People</h2><button class="btn tiny-btn primary" data-action="quickAddPerson">${ic('plus')} Met someone new</button></div><p class="meta">Only mark people you actually met. To remember one conversation, use “Add conversation note” below; no need to record everyone.</p>${people.length?people.map(p=>`<div class="event-guest"><div class="avatar">${esc(p.name[0]||'?')}</div><div class="grow"><strong>${esc(p.name)}</strong><div class="meta ellipsis">${esc(personCircles(p).join(' · ')||'No circle')}${recentFor(p.id)?' · Last '+fmt(recentFor(p.id).date):''}</div><div class="meta ellipsis">${recentFor(p.id)?'Last conversation: '+esc(recentFor(p.id).text.slice(0,120)):'No previous conversation logged.'}</div>${p.notes?`<div class="meta ellipsis">Remember: ${esc(p.notes.slice(0,100))}</div>`:''}</div><button class="btn tiny-btn ${ev.metPersonIds?.includes(p.id)?'subtle':'primary'}" data-action="toggleMet" data-id="${esc(p.id)}">${ev.metPersonIds?.includes(p.id)?'✓ Met':'Mark met'}</button><button class="btn tiny-btn" data-person="${esc(p.id)}" aria-label="Open ${esc(p.name)}">${ic('chevron')}</button></div>`).join(''):'<div class="empty">Add planned participants or someone you meet here.</div>'}<div class="buttons" style="margin:11px 0"><button class="btn primary" data-action="logFromEvent">${ic('plus')} Add conversation note</button><button class="btn subtle" data-action="eventPost">Afterward ↓</button></div><div class="sectionhead section"><h2>Conversation notes · ${moments.length}</h2></div>${moments.length?`<div class="list">${moments.map(momentRow).join('')}</div>`:'<div class="empty">You can log just one important conversation, or none. A guest list is not a conversation log.</div>'}<section id="postmortem" class="section"><div class="sectionhead"><h2>Afterward</h2>${pm.completedAt?'<span class="inline-status">Saved</span>':''}</div><form id="postForm" class="card form"><p class="meta">All optional. A normal gathering doesn't have to change anything.</p><div class="field"><label class="label">How did it go?</label><textarea name="overall" maxlength="6000" placeholder="e.g. A nice evening, a little tiring.">${esc(pm.overall||'')}</textarea></div><div class="field" style="margin-top:9px"><label class="label">Worth remembering about this social?</label><textarea name="remember" maxlength="6000" placeholder="e.g. The small group made conversation easier.">${esc(pm.remember||'')}</textarea><p class="meta">Saved with this social. For a fact about a specific person, use + Remember something below.</p></div>${pm.changes?`<div class="note sm"><strong>Earlier change note (kept from v0.6):</strong> ${esc(pm.changes)}</div>`:''}<div class="field" style="margin-top:9px"><label class="choice"><input type="checkbox" id="eventChanged" name="hasChange" value="yes" ${pm.changeNote?'checked':''}>A connection felt different this time (optional)</label><div id="eventChangeFields" class="${pm.changeNote?'':'hidden'}" style="margin-top:7px"><label class="label">With whom?</label><select name="changePersonId"><option value="">Choose a person</option>${people.map(p=>`<option value="${esc(p.id)}" ${pm.changePersonId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label class="label" style="margin-top:7px">What felt different?</label><textarea name="changeNote" maxlength="3000" placeholder="Only what you noticed; no need to change their closeness label.">${esc(pm.changeNote||'')}</textarea></div></div><div class="field" style="margin-top:9px"><label class="label">Next time (optional)</label><textarea name="nextTime" maxlength="6000" placeholder="Something I'd like to do again or differently.">${esc(pm.nextTime||'')}</textarea></div><div class="buttons"><button type="submit" class="btn primary">Save recap</button></div></form><div class="sectionhead section"><h2>Things to remember from this social</h2><button class="btn tiny-btn primary" data-action="addLearning" data-source="event">+ Remember something</button></div><p class="meta">Save a person fact in that person's profile, a note about this social here, or a discovery about yourself in Review.</p>${db.learnings.filter(l=>l.eventId===ev.id).map(learningItem).join('')||'<div class="empty">No notes saved here yet.</div>'}</section><div class="section"><button class="btn danger tiny-btn" data-action="deleteEvent">Delete social (keep conversation notes)</button></div></div>`;}
function socialRow(item){if(item.type==='event'){let ev=item.record;return `<div class="rowcard clickable" data-event="${esc(ev.id)}" role="button" tabindex="0">${ic('calendar')}<div class="grow"><strong>${esc(ev.name)}</strong><div class="meta">${fmt(ev.date)} · ${esc(circleName(ev.circleId)||'No circle')} · ${ev.status==='cancelled'?'Cancelled':ev.status==='completed'?'Done':ev.date<localDate()?'Past':'Planned'}</div><div class="meta">${(ev.metPersonIds||[]).length} people met · ${db.moments.filter(m=>m.eventId===ev.id).length} conversation notes${ev.postMortem?.completedAt?' · Recap saved':''}</div></div>${ic('chevron')}</div>`;}let x=item.record;return `<div class="rowcard clickable" data-moment="${esc(x.id)}" role="button" tabindex="0">${ic('book')}<div class="grow"><strong>${esc(momentPeople(x))}</strong><div class="meta">${fmt(x.date)} · ${esc(kindLabel(x.kind))} · Earlier standalone record</div><div class="meta ellipsis">${esc((x.text||'').slice(0,130))}</div></div>${ic('chevron')}</div>`;}
function eventsPage(){if(mode==='eventForm')return eventForm();if(selectedEvent)return eventDetail();const v=db.settings.eventView,today=localDate(),selected=v.period||'upcoming';let items=[...db.events.map(record=>({type:'event',record,date:record.date||''})),...db.moments.filter(x=>!x.eventId).map(record=>({type:'moment',record,date:record.date||''}))];items=items.filter(item=>{if(v.circle){if(item.type==='event'){if(item.record.circleId!==v.circle)return false}else if(!item.record.personIds.some(id=>(getPerson(id)?.circleIds||[]).includes(v.circle)))return false}if(selected==='all')return true;if(item.type==='event'){let ev=item.record;return selected==='upcoming'?ev.date>=today&&ev.status!=='cancelled'&&ev.status!=='completed':ev.date<today||ev.status==='completed'||ev.status==='cancelled'}return selected==='past';}).sort((a,b)=>v.order==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));return `<div class="wrap">${pageHeading('PLANS + TIME TOGETHER','Socials',`<button class="btn primary tiny-btn" data-action="newEvent">${ic('plus')} Social</button>`)}<p class="meta">A Social can be one friend or a group. Old standalone conversation records are shown here too, so nothing gets lost.</p><div class="event-controls"><div class="segment" aria-label="Social date groups">${[['upcoming','Upcoming'],['past','Past'],['all','All']].map(([k,n])=>`<button type="button" class="${selected===k?'active':''}" data-action="eventPeriod" data-value="${k}" aria-pressed="${selected===k}">${n}</button>`).join('')}</div><select id="eventCircleFilter" aria-label="Filter socials by circle"><option value="">All circles</option>${db.circles.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${esc(c.id)}" ${v.circle===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="eventOrder" aria-label="Sort socials"><option value="newest" ${v.order==='newest'?'selected':''}>Newest first</option><option value="oldest" ${v.order==='oldest'?'selected':''}>Oldest first</option></select></div><div class="meta" style="margin-bottom:9px">${items.length} socials</div>${items.length?`<div class="list">${items.map(socialRow).join('')}</div>`:'<div class="empty">No socials for this selection.</div>'}</div>`;}
function activityPage(){let all=[...db.moments.map(m=>({date:m.date||'',createdAt:m.createdAt||'',type:'moments',html:momentRow(m)})),...db.invitations.map(i=>({date:i.date||'',createdAt:i.createdAt||'',type:'invitations',html:invitationRow(i)}))].filter(x=>activityType==='all'||x.type===activityType).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return `<div class="controls" style="margin-bottom:9px"><button class="btn tiny-btn ${activityType==='all'?'primary':''}" data-action="activityFilter" data-value="all">All</button><button class="btn tiny-btn ${activityType==='moments'?'primary':''}" data-action="activityFilter" data-value="moments">Moments</button><button class="btn tiny-btn ${activityType==='invitations'?'primary':''}" data-action="activityFilter" data-value="invitations">Invitations</button></div>${all.length?`<div class="list">${all.map(a=>a.html).join('')}</div>`:'<div class="empty">Nothing logged here yet.</div>'}`;}
function reviewPage(){let navs=[['overview','Monthly review'],['learn','Learnings'],['settings','Settings']];let head=`<div class="wrap">${pageHeading('LOOK BACK, NOTICE, ADJUST','Review')}<div class="review-tabs">${navs.map(([k,v])=>`<button class="btn tiny-btn ${subTab===k?'active':''}" data-subtab="${k}">${v}</button>`).join('')}</div>`;let inner=subTab==='learn'?learningPage():subTab==='settings'?settingsPage():overviewPage();return head+inner+'</div>';}
function settingsPage(){return `<div class="sectionhead"><h2>Reminder rules</h2></div>${rulesPage()}<div class="sectionhead section"><h2>Data & backup</h2></div>${dataPage()}`;}
function overviewPage(){let mm=monthMoments(reviewMonth),uniqueMet=metInMonth(reviewMonth),meetups=meetupsInMonth(reviewMonth),newPeople=newPeopleMetInMonth(reviewMonth),r=reviewFor(reviewMonth),insights=mm.filter(m=>m.insight?.trim()).length,events=db.events.filter(e=>(e.date||'').slice(0,7)===reviewMonth),pm=events.filter(e=>e.postMortem?.completedAt),changes=db.statusHistory.filter(h=>(h.date||'').slice(0,7)===reviewMonth).sort((a,b)=>b.date.localeCompare(a.date)),feelings={},monthInvitations=db.invitations.filter(i=>i.date?.slice(0,7)===reviewMonth);for(let m of mm)if(m.feeling)feelings[m.feeling]=(feelings[m.feeling]||0)+1;let categories=[...closeOpts.slice(1),'Not set'].map(k=>({key:k,n:db.people.filter(p=>(p.closeness||'Not set')===k).length}));return `<div class="controls" style="margin-bottom:9px">${monthSelect()}</div><div class="review-stat-grid"><div class="stat"><div class="num">${db.people.length}</div><div class="meta">People · live</div></div><div class="stat"><div class="num">${categories.find(c=>c.key==='Inner circle').n}</div><div class="meta">Inner circle · live</div></div><div class="stat"><div class="num">${uniqueMet.size}</div><div class="meta">People seen · ${esc(reviewMonth)}</div></div><div class="stat"><div class="num">${meetups}</div><div class="meta">Meetups · ${esc(reviewMonth)}</div></div><div class="stat"><div class="num">${newPeople}</div><div class="meta">New people met</div></div><div class="stat"><div class="num">${pm.length} / ${events.length}</div><div class="meta">Social reflections</div></div></div><div class="card" style="margin-top:10px"><h3>Relationship distribution · now</h3>${categories.map(c=>`<div class="row" style="display:flex;align-items:center;gap:8px;margin:5px 0"><span class="sm grow">${esc(c.key)}</span><strong class="sm">${c.n}</strong></div>`).join('')}<p class="meta">Current labels are self-assigned, not inferred. Counts change when you edit a profile.</p></div><div class="card"><h3>What your records show · ${esc(reviewMonth)}</h3><p class="sm">${mm.length} conversations · ${uniqueMet.size} people seen (unique) · ${insights} moment learnings · ${pm.length} social recaps.</p>${Object.keys(feelings).length?`<p class="meta">Feelings you selected: ${Object.entries(feelings).map(([k,v])=>esc(k)+': '+v).join(' · ')}</p>`:''}<p class="meta">Planned attendance is excluded. Meetups count confirmed gatherings once plus standalone in-person moments. New people met counts people added and first confirmed seen this month. No unlogged contact is inferred.</p></div><div class="card"><h3>Invitations · ${esc(reviewMonth)}</h3><p class="sm">${monthInvitations.length} sent · ${monthInvitations.filter(i=>i.outcome==='accepted').length} accepted · ${monthInvitations.filter(i=>i.outcome==='pending').length} awaiting reply · ${monthInvitations.filter(i=>['declined','unavailable'].includes(i.outcome)).length} declined or unavailable.</p><p class="meta">These are recorded responses, not reasons or relationship scores. Invitations never count as meetings.</p></div><div class="sectionhead section"><h2>Relationship changes</h2><span class="meta">${changes.length} recorded</span></div>${changes.length?`<div class="status-history">${changes.map(h=>`<div class="status-line"><strong>${esc(pname(h.personId))}</strong>${statusChangeHTML(h)}</div>`).join('')}</div>`:'<p class="meta">No changes explicitly recorded this month.</p>'}<div class="sectionhead section"><h2>Social notes</h2></div>${pm.filter(e=>e.postMortem?.learning?.trim()||e.postMortem?.changes?.trim()).length?pm.filter(e=>e.postMortem?.learning?.trim()||e.postMortem?.changes?.trim()).map(e=>`<div class="card"><button class="btn tiny-btn subtle" data-event="${esc(e.id)}">${esc(e.name)} · ${fmt(e.date)} →</button>${e.postMortem.changes?`<p class="sm detail">Changed: ${esc(e.postMortem.changes)}</p>`:''}${e.postMortem.learning?`<p class="sm detail">Learned: ${esc(e.postMortem.learning)}</p>`:''}</div>`).join(''):'<div class="empty">Save a social function goalsPage(){let goals=db.goals.filter(g=>g.month===reviewMonth);return `<div class="card sage"><strong>A gentle direction, not a score.</strong><div class="muted sm">Choose targets that make your social life better. A friend you see three times counts as one person. A run together can be logged as one conversation; a planned social is optional.</div></div>${goals.length?`<div class="list">${goals.map(g=>{let n=progress(g),pct=Math.min(100,Math.round(n/Math.max(1,g.target)*100));return `<div class="card"><div class="heading" style="margin-bottom:0"><strong>${esc(g.label||goalTypeLabel(g.type))}</strong><span class="meta">${n} / ${g.target}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="mutedline">${esc(goalTypeLabel(g.type))}${g.type==='custom'?' · manually updated':''}</div><div class="buttons" style="margin-top:7px">${g.type==='custom'?`<button class="btn tiny-btn" data-action="progressGoal" data-id="${esc(g.id)}">Update progress</button>`:''}<button class="btn tiny-btn danger" data-action="deleteGoal" data-id="${esc(g.id)}">Remove</button></div></div>`}).join('')}</div>`:'<div class="empty">Choose one or two realistic intentions for this month.</div>'}<p class="muted tiny">Goals update from new records; old moments with no interaction type are never guessed to be in-person meetups.</p>`;}
function goalTypeLabel(t){return ({meet:'Different friends I saw',reach:'Friends I called or messaged',followup:'Follow-ups I finished',custom:'My own goal'})[t]||t;}
