function metSince(id,start){return db.moments.some(m=>(m.personIds||[]).includes(id)&&m.date>=start&&m.date<=localDate()&&(m.kind==='inPerson'||m.kind==='event'&&m.countsAsContact===true))||db.events.some(e=>(e.status==='completed'||e.legacyAttendance||explicitMetIds(e).length>0)&&e.date>=start&&e.date<=localDate()&&(e.format==='inPerson'||!e.format)&&explicitMetIds(e).includes(id));}
function personActivityMatches(p,activity){const today=localDate();if(activity==='metWeek')return metSince(p.id,datePlus(today,-6));if(activity==='metMonth')return metSince(p.id,today.slice(0,7)+'-01');if(activity==='never')return !db.moments.some(m=>(m.personIds||[]).includes(p.id))&&!db.invitations.some(i=>i.personId===p.id)&&!db.events.some(e=>(e.metPersonIds||[]).includes(p.id));if(activity==='due')return !!(attentionDate(p.id)&&attentionDate(p.id)<=today);return true;}
function sortPeople(list){const sort=peopleView().sort,today=localDate();const closeOrder={'Inner circle':0,'Close':1,'Warm':2,'Light':3,'Acquaintance':4};return list.sort((a,b)=>{let x=0;if(sort==='recent')x=(lastContactDate(b.id)||'').localeCompare(lastContactDate(a.id)||'');if(sort==='attention'){const da=attentionDate(a.id),dbb=attentionDate(b.id);x=(!da===!dbb?0:da?-1:1)||(da||'').localeCompare(dbb||'');}if(sort==='closeness')x=(closeOrder[a.closeness]??5)-(closeOrder[b.closeness]??5);if(sort==='added')x=(b.createdAt||'').localeCompare(a.createdAt||'');if(sort==='longest'){const da=lastContactDate(a.id),dbb=lastContactDate(b.id);x=(!!da===!!dbb?0:da?-1:1)||da.localeCompare(dbb);}return x||(a.name||'').localeCompare(b.name||'');});}

function datePlus(date,days){const x=new Date(date+'T12:00:00Z');if(Number.isNaN(x.getTime()))return '';x.setUTCDate(x.getUTCDate()+days);return x.toISOString().slice(0,10)}
function ruleDays(p){if(p.cadenceMode==='off')return 0;if(p.cadenceMode==='override')return Number(p.cadenceDays||0);return Number(db.settings.cadenceRules[p.closeness]||0)}
function qualifiesAsContact(m){return m.countsAsContact===true||(m.countsAsContact===undefined&&['inPerson','call','message'].includes(m.kind))}
function lastMeaningfulContact(id){const notes=db.moments.filter(m=>(m.personIds||[]).includes(id)&&m.date&&qualifiesAsContact(m)).map(m=>({date:m.date,text:m.text||'',type:'note'}));const socials=db.events.filter(ev=>(ev.status==='completed'||ev.legacyAttendance)&&ev.date&&(((ev.format==='inPerson'||!ev.format)&&(ev.metPersonIds||[]).includes(id))||(ev.format&&ev.format!=='inPerson'&&(ev.contactPersonIds||[]).includes(id)))).map(ev=>({date:ev.date,text:ev.name||'',type:'social'}));return [...notes,...socials].sort((a,b)=>b.date.localeCompare(a.date))[0];}
function autoSuggestions(){const today=localDate();return db.people.flatMap(p=>{const days=ruleDays(p);if(!Number.isInteger(days)||days<1||days>365)return [];const last=lastMeaningfulContact(p.id);if(!last?.date)return [];const next=datePlus(last.date,days);if(!next||next>today||(p.nextAutoReminderAfter||'')>today)return [];if(pending().some(r=>r.personId===p.id&&r.dueDate&&r.dueDate<=today))return [];return [{person:p,last:last.date,next,days}]}).sort((a,b)=>a.next.localeCompare(b.next));}

function eventName(id){return db.events.find(e=>e.id===id)?.name||''}

function recordStatus(person,values,source,date,momentId='',reason=''){const changes=[];for(const field of ['closeness','intention']){if(!Object.prototype.hasOwnProperty.call(values,field))continue;const from=person[field]||'',to=values[field]||'';if(from!==to){changes.push({field,from,to});person[field]=to;}}if(changes.length){const eventId=momentId?db.moments.find(m=>m.id===momentId)?.eventId||'':'';db.statusHistory.push({id:uid(),personId:person.id,momentId,eventId,source,date,changes,reason:String(reason||'').trim(),createdAt:now()});person.updatedAt=now();}return changes.length;}
function dayNumber(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function dailyThought(){const options=[];
 const relations=db.relationshipChanges.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const closer=relations.find(r=>r.direction==='closer'&&r.eventId&&eventName(r.eventId));if(closer)options.push({text:'Closeness rarely announces itself. Sometimes you notice only afterward that a conversation has stayed with you.',eventId:closer.eventId});
 const unsure=relations.find(r=>r.direction==='unsure'&&r.eventId&&eventName(r.eventId));if(unsure)options.push({text:'Not knowing where a relationship stands is not the same as knowing something has gone wrong.',eventId:unsure.eventId});
 const thought=db.learnings.find(l=>l.scope==='self'&&l.text?.trim());if(thought)options.push({text:'What you learn about yourself is a working theory, not a verdict. Another conversation may add a footnote.',learning:true});
 const invite=db.invitations.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];if(invite)options.push({text:'An invitation is an opening, not a bargain. Its meaning does not depend on securing a yes.',invitationId:invite.id});
 const done=db.events.filter(e=>e.status==='completed'&&socialActualIds(e).length>0).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];if(done)options.push({text:'Not every meeting needs a turning point. Being able to spend time together, without performing for an outcome, matters too.',eventId:done.id});
 const plan=db.events.filter(e=>e.status==='planned'&&socialPeople(e).length>0).sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];if(plan)options.push({text:'You can prepare for a conversation without deciding in advance what it must become.',eventId:plan.id});
 return options.length?options[dayNumber()%options.length]:null;}

function refreshPeoplePicker(node){if(!node)return;const selected=node._selected||new Set();let q=node.querySelector('.picker-search').value.toLowerCase().trim(),c=node.querySelector('.picker-circle').value;let matching=allPeople().filter(p=>(!c||(p.circleIds||[]).includes(c))&&(!q||(p.name+' '+(p.notes||'')+' '+personCircles(p).join(' ')).toLowerCase().includes(q)));node._visible=matching.slice(0,35).map(p=>p.id);node.querySelector('.picker-meta').textContent=`${selected.size} selected · ${matching.length} matching${matching.length>35?' · showing first 35, search to narrow':''}`;node.querySelector('.picker-choices').innerHTML=matching.slice(0,35).map(p=>`<label><input type="checkbox" class="picker-check" value="${esc(p.id)}" ${selected.has(p.id)?'checked':''}><span>${esc(p.name)} <span class="meta">${esc(personCircles(p).join(', '))}</span></span></label>`).join('')||'<div class="empty">No people found. Try another search or circle.</div>';node.querySelector('.picker-chips').innerHTML=[...selected].map(id=>getPerson(id)).filter(Boolean).map(p=>`<span class="picker-chip"><button type="button" class="chip-profile" data-person="${esc(p.id)}" aria-label="Open ${esc(p.name)} profile">${esc(p.name)} ↗</button><button type="button" class="chip-remove" data-remove-person="${esc(p.id)}" aria-label="Remove ${esc(p.name)} from selection">×</button></span>`).join('');node.querySelector('.picker-hidden').innerHTML=[...selected].filter(id=>!!getPerson(id)).map(id=>`<input type="hidden" name="personIds" value="${esc(id)}">`).join('');refreshStatusSubject(node.closest('form'));refreshFollowupSubject(node.closest('form'));}
