<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee9e2"><title>fondly. — People, remembered</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#3b3936;background:#eee9e2;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1050px;min-height:100vh;margin:auto;background:#faf8f5;box-shadow:0 8px 60px #65554b14}.top{padding:26px 34px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e1da}.brand{font-family:Georgia,serif;font-size:36px;letter-spacing:-2px;color:#735e56}.tagline{font-size:12px;color:#9a8a7f;letter-spacing:.07em}.badge{background:#e9e4dc;border-radius:99px;padding:7px 11px;font-size:12px;color:#766f65}.tabs{display:flex;gap:6px;padding:12px 30px;border-bottom:1px solid #e8e1da;overflow:auto}.tab{border:0;background:transparent;padding:12px 15px;border-radius:12px;color:#857a72;white-space:nowrap}.tab.active{background:#e8ded6;color:#644f47;font-weight:650}.main{padding:30px 34px 60px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.035em;font-size:35px;margin:0 0 8px}h2{font-family:Georgia,serif;font-size:25px;font-weight:400;margin:0 0 14px}h3{margin:0 0 8px;font-size:16px}p{line-height:1.55}.muted{color:#8b8178}.small{font-size:12px}.btn{border:1px solid #d7cbc0;border-radius:12px;background:white;color:#61554e;padding:11px 15px;font-weight:550}.btn.primary{background:#786357;color:white;border-color:#786357}.btn.danger{color:#9a4545}.btn.ghost{background:transparent}.actions{display:flex;flex-wrap:wrap;gap:9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{padding:20px;border:1px solid #e8e0d8;background:white;border-radius:18px}.card.warm{background:#f1e9e1;border-color:#f1e9e1}.card.green{background:#eaf0e7;border-color:#eaf0e7}.card .big{font-family:Georgia,serif;font-size:33px}.section{margin-top:32px}.list{display:grid;gap:10px}.item{background:white;border:1px solid #e8e0d8;border-radius:15px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.item.click{cursor:pointer}.item.click:hover{border-color:#bca99c}.avatar{width:42px;height:42px;flex:none;display:grid;place-items:center;background:#e9ddd3;color:#755f55;border-radius:50%;font-family:Georgia,serif;font-size:20px}.personline{display:flex;align-items:center;gap:12px;min-width:0}.personline strong{display:block}.personline .muted{margin-top:4px}.pill{display:inline-block;background:#f2eee8;padding:5px 10px;border-radius:50px;font-size:12px;color:#76695e;margin:2px 5px 2px 0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}input,textarea,select{border:1px solid #ded5cc;border-radius:10px;background:#fff;padding:11px;color:#403b37;width:100%;outline-color:#ab9180}textarea{min-height:90px;resize:vertical}label{font-size:12px;color:#736a62;font-weight:650;display:block;margin:0 0 6px}.field{margin-bottom:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.full{grid-column:1/-1}.columns{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.empty{padding:30px;text-align:center;color:#8b8178;background:#f3eee8;border-radius:16px}.entry{border-left:2px solid #d1bdad;padding:0 0 15px 17px;margin:14px 0}.entry p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice{background:#fff5e5;border:1px solid #eddec4;padding:13px 15px;border-radius:12px;color:#7a6048;font-size:13px;line-height:1.6}.success{background:#e8f1e6;color:#466647}.hidden{display:none!important}.divider{border-top:1px solid #ebe4de;margin:22px 0}.header-right{display:flex;align-items:center;gap:10px}.responsive{max-width:650px}.radio-row{display:flex;flex-wrap:wrap;gap:7px}.radio-row label{cursor:pointer;padding:9px 12px;background:#f2ece6;border-radius:10px;font-size:13px;color:#6c5e53}.radio-row input{width:auto;accent-color:#80685c}.footer{color:#988a80;font-size:12px;padding:24px 34px;border-top:1px solid #e8e1da}.detail-note{white-space:pre-wrap;overflow-wrap:anywhere}.back{border:0;background:none;color:#8c7768;padding:0 0 20px}.file{display:none}.mini{font-size:12px;color:#96877d}.count{margin-left:auto}.flow{display:grid;gap:12px}.reminder-text{overflow-wrap:anywhere}.warn{color:#a05252}.status{font-size:12px;color:#64825f}.kbd{font-family:monospace;background:#f0eae3;padding:2px 5px;border-radius:4px}@media(max-width:710px){.top{padding:20px}.main{padding:24px 18px 42px}.tabs{padding:8px 12px}.cards{grid-template-columns:1fr}.columns,.formgrid{grid-template-columns:1fr}.intro{align-items:flex-start;flex-direction:column}h1{font-size:31px}.item{align-items:flex-start}.header-right .badge{display:none}.footer{padding:22px}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">fondly.</div><div class="tagline">THE PEOPLE YOU WANT TO REMEMBER</div></div><div class="header-right"><span class="badge">private · on this browser</span><button class="btn" id="topBackup">↓ Backup</button></div></header><nav class="tabs" id="nav" aria-label="Main navigation"><button class="tab active" data-tab="home">Home</button><button class="tab" data-tab="people">People</button><button class="tab" data-tab="moments">Moments</button><button class="tab" data-tab="reflect">Reflect</button><button class="tab" data-tab="data">Data & backup</button></nav><main class="main" id="view"></main><footer class="footer">Fondly v0.1 · A private, local-first prototype. Export backups regularly; deleting browser data may erase local records.</footer></div><input type="file" id="importFile" class="file" accept="application/json,.json"><script>
'use strict';
const KEY='fondly.data.v1'; const SCHEMA=1; const now=()=>new Date().toISOString();const uid=()=> typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=s=>s?new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not yet';const blank=()=>({schemaVersion:SCHEMA,app:'fondly',createdAt:now(),updatedAt:now(),people:[],moments:[],reminders:[],settings:{},extensions:{}});
// Migration path: change SCHEMA and append pure version-to-version migrations here. Unknown keys are retained.
const migrations={};
function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Not a Fondly backup.');if(raw.app!=='fondly')throw Error('This file is not a Fondly backup.');let d=structuredClone(raw);if(!Number.isInteger(d.schemaVersion)||d.schemaVersion<1)throw Error('Invalid backup version.');if(d.schemaVersion>SCHEMA)throw Error('This backup comes from a newer version of Fondly. Please use a newer app; no data was changed.');while(d.schemaVersion<SCHEMA){if(!migrations[d.schemaVersion])throw Error('No migration available for this backup.');d=migrations[d.schemaVersion](d);}for(const k of ['people','moments','reminders'])if(!Array.isArray(d[k]))throw Error('Invalid '+k+' records.');for(const k of ['people','moments','reminders']){const seen=new Set();for(const r of d[k]){if(!r||typeof r!=='object'||typeof r.id!=='string'||!r.id||seen.has(r.id))throw Error('Invalid or duplicate ID in '+k);seen.add(r.id);}}if(d.people.length>10000||d.moments.length>100000||d.reminders.length>100000)throw Error('Backup too large for this prototype.');return d;}
let db;try{db=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){db=blank();if(localStorage.getItem(KEY))alert('Stored data could not be read ('+e.message+'). It has NOT been overwritten. Export or copy your original browser storage before adding new records.');}
let tab='home',selected=null,editing=null,notice='',search='',circleFilter='',reflectPerson='';let safeStorage=true;function persist(){db.updatedAt=now();try{localStorage.setItem(KEY,JSON.stringify(db));safeStorage=true;return true}catch(e){safeStorage=false;alert('Could not save to browser storage. Export a JSON backup now. '+e.message);return false}}
function setNotice(s){notice=s;render();}function buttons(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));}
function nav(t){tab=t;selected=null;editing=null;search='';notice='';render();window.scrollTo(0,0)}function allPeople(){return db.people.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''))}function pname(id){return db.people.find(p=>p.id===id)?.name||'Deleted person'}function person(id){return db.people.find(p=>p.id===id)}function latest(id){return db.moments.filter(m=>(m.personIds||[]).includes(id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]}
const form=(id,fields)=>document.getElementById(id).addEventListener('submit',fields);function el(id){return document.getElementById(id)}function peopleOptions(ids=[]){return allPeople().map(p=>`<label><input type="checkbox" name="personIds" value="${esc(p.id)}" ${ids.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}
function render(){buttons();el('view').innerHTML=(notice?`<div class="notice success" role="status" style="margin-bottom:18px">${esc(notice)}</div>`:'')+({home:home,people:peoplePage,moments:momentsPage,reflect:reflectPage,data:dataPage}[tab]||home)();bind();}
function home(){let pending=db.reminders.filter(r=>!r.done&&r.dueDate&&r.dueDate<=new Date().toISOString().slice(0,10)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));let recent=db.moments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);return `<div class="intro"><div><div class="muted small">YOUR LITTLE SPACE FOR PEOPLE</div><h1>Good to see you.</h1><div class="muted">A little attention goes a long way.</div></div><button class="btn primary" data-action="newMoment">+ Capture a moment</button></div><div class="cards"><section class="card warm"><div class="muted small">PEOPLE TO REMEMBER</div><div class="big">${db.people.length}</div><p class="small">Your private people directory.</p><button class="btn" data-action="newPerson">+ Add someone</button></section><section class="card green"><div class="muted small">FOLLOW-UPS DUE</div><div class="big">${pending.length}</div><p class="small">Only reminders you choose to set.</p><button class="btn" data-action="goReflect">View reminders →</button></section><section class="card"><div class="muted small">MOMENTS SAVED</div><div class="big">${db.moments.length}</div><p class="small">A growing record of your connections.</p><button class="btn" data-action="goMoments">Explore moments →</button></section></div><section class="section"><h2>Gentle reminders</h2>${pending.length?`<div class="list">${pending.slice(0,5).map(r=>`<div class="item"><div><strong>${esc(pname(r.personId))}</strong><p class="reminder-text">${esc(r.text)}</p><span class="mini">Due ${esc(r.dueDate)}</span></div><button class="btn" data-done="${esc(r.id)}">Done</button></div>`).join('')}</div>`:'<div class="empty">Nothing due. No pressure, no streaks. ♡</div>'}</section><section class="section"><h2>Recent moments</h2>${recent.length?`<div class="list">${recent.map(m=>momentCard(m)).join('')}</div>`:'<div class="empty">Start with someone you met recently. A sentence is plenty.</div>'}</section>`}
function peoplePage(){if(editing==='new'||editing==='edit')return personForm();if(selected)return personDetail();let list=allPeople().filter(p=>(p.name+' '+(p.circle||'')+' '+(p.notes||'')).toLowerCase().includes(search.toLowerCase())&&(!circleFilter||p.circle===circleFilter));let circles=[...new Set(db.people.map(p=>p.circle).filter(Boolean))].sort();return `<div class="intro"><div><h1>Your people.</h1><div class="muted">No rankings. Just names and things worth remembering.</div></div><button class="btn primary" data-action="newPerson">+ Add person</button></div><div class="toolbar"><input id="search" placeholder="Search people, circles, notes…" value="${esc(search)}" aria-label="Search people" style="flex:2;min-width:180px"><select id="circleFilter" style="flex:1;min-width:160px"><option value="">All circles</option>${circles.map(c=>`<option value="${esc(c)}" ${circleFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="peopleResults" class="list">${list.length?list.map(p=>personRow(p)).join(''):'<div class="empty">No people here yet. Add your first person ♡</div>'}</div>`}
function personRow(p){let last=latest(p.id);return `<div class="item click" data-person="${esc(p.id)}" role="button" tabindex="0"><div class="personline"><div class="avatar">${esc((p.name||'?').trim()[0]||'?')}</div><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.circle||'No circle')} · ${last?'Last moment '+esc(day(last.date)):'No moments yet'}</div></div></div><span class="muted">→</span></div>`}
function personForm(){let p=editing==='edit'?person(selected):{};return `<button class="back" data-action="cancelPerson">← Back</button><h1>${editing==='new'?'A person to remember.':'Edit person.'}</h1><p class="muted">Only a name is required. Add details at your own pace.</p><form id="personForm" class="responsive card"><div class="formgrid"><div class="field"><label for="pName">Name *</label><input id="pName" name="name" maxlength="150" required value="${esc(p.name||'')}" autofocus></div><div class="field"><label for="pCircle">Circle / group</label><input id="pCircle" name="circle" maxlength="120" placeholder="e.g. School, old friends" value="${esc(p.circle||'')}"></div><div class="field"><label for="pHow">How you met</label><input id="pHow" name="howMet" maxlength="300" value="${esc(p.howMet||'')}"></div><div class="field"><label for="pContact">Contact (optional)</label><input id="pContact" name="contact" maxlength="300" value="${esc(p.contact||'')}"></div><div class="field full"><label for="pFamily">Family / connections (only what you choose to record)</label><textarea id="pFamily" name="family">${esc(p.family||'')}</textarea></div><div class="field full"><label for="pNotes">Things I want to remember</label><textarea id="pNotes" name="notes" placeholder="Interests, conversations, small details…">${esc(p.notes||'')}</textarea></div></div><div class="actions"><button class="btn primary" type="submit">Save person</button><button class="btn" type="button" data-action="cancelPerson">Cancel</button></div></form>`}
function personDetail(){let p=person(selected);if(!p){selected=null;return peoplePage()}let moments=db.moments.filter(m=>(m.personIds||[]).includes(p.id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));let reminders=db.reminders.filter(r=>r.personId===p.id&&!r.done).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));return `<button class="back" data-action="backPeople">← All people</button><div class="intro"><div class="personline"><div class="avatar" style="width:64px;height:64px;font-size:30px">${esc(p.name[0]||'?')}</div><div><h1 style="margin:0">${esc(p.name)}</h1><span class="pill">${esc(p.circle||'No circle')}</span></div></div><div class="actions"><button class="btn" data-action="editPerson">Edit</button><button class="btn primary" data-action="momentForPerson">+ Moment</button></div></div><div class="columns"><div><section class="card"><h3>Remember</h3>${[['How you met',p.howMet],['Contact',p.contact],['Family & connections',p.family],['Notes',p.notes]].map(([k,v])=>`<div style="margin:14px 0"><div class="mini">${k}</div><div class="detail-note">${esc(v||'—')}</div></div>`).join('')}</section><section class="card section"><h3>Upcoming follow-ups</h3>${reminders.length?reminders.map(r=>`<div class="entry"><div>${esc(r.text)}</div><div class="mini">${esc(r.dueDate||'No date')}</div><button class="btn" data-done="${esc(r.id)}">Mark done</button></div>`).join(''):'<p class="muted small">No follow-ups set.</p>'}<button class="btn" data-action="reminderForPerson">+ Reminder</button></section><section class="section"><button class="btn danger" data-delete-person="${esc(p.id)}">Delete person & their moments</button></section></div><section><h2>Shared moments</h2>${moments.length?moments.map(m=>momentCard(m)).join(''):'<div class="empty">No moments recorded yet.</div>'}</section></div>`}
function momentCard(m){return `<div class="item click" data-moment="${esc(m.id)}" role="button" tabindex="0"><div style="min-width:0"><div class="mini">${esc(day(m.date))} · ${esc((m.personIds||[]).map(pname).join(', ')||'No people')}</div><p style="margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc((m.text||'').slice(0,220))}${(m.text||'').length>220?'…':''}</p>${m.feeling?`<span class="pill">${esc(m.feeling)}</span>`:''}</div><span class="muted">→</span></div>`}
function momentsPage(){if(editing==='newMoment'||editing==='editMoment')return momentForm();if(selected&&db.moments.some(m=>m.id===selected))return momentDetail();let moments=db.moments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="intro"><div><h1>Little moments.</h1><div class="muted">Write what happened. One sentence is enough.</div></div><button class="btn primary" data-action="newMoment">+ Capture</button></div>${moments.length?`<div class="list">${moments.map(momentCard).join('')}</div>`:'<div class="empty">Your timeline starts here. ♡</div>'}`}
function momentForm(){let m=editing==='editMoment'?db.moments.find(x=>x.id===selected):{};let date=m.date||new Date().toISOString().slice(0,10);let ids=m.personIds||(person(selected)?[selected]:[]);return `<button class="back" data-action="cancelMoment">← Back</button><h1>${editing==='newMoment'?'Capture a moment.':'Edit moment.'}</h1><p class="muted">A memory, not a homework assignment.</p><form id="momentForm" class="responsive card"><div class="field"><label>Who was there? *</label><div class="radio-row">${peopleOptions(ids)||'<span class="muted">Add a person first.</span>'}</div></div><div class="field"><label for="mDate">Date *</label><input type="date" id="mDate" name="date" required value="${esc(date)}"></div><div class="field"><label for="mText">What happened? *</label><textarea id="mText" name="text" required placeholder="We chatted about…">${esc(m.text||'')}</textarea></div><div class="field"><label>How did it feel? Optional, private.</label><select name="feeling"><option value="">Skip reflection</option>${['Lovely','Good','Neutral','Draining','Mixed'].map(x=>`<option ${m.feeling===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="mReflection">Anything you want to reflect on? Optional.</label><textarea id="mReflection" name="reflection" placeholder="How do I want this relationship to develop?">${esc(m.reflection||'')}</textarea></div><div class="divider"></div><h3>Optional follow-up</h3><p class="muted small">Set a reminder only if you want one. This does not send a message to anyone.</p><div class="field"><label for="mFollow">Remember to…</label><input id="mFollow" name="followText" placeholder="Ask about the move, plan coffee…"></div><div class="field"><label for="mFollowDate">On</label><input id="mFollowDate" name="followDate" type="date"></div><div class="actions"><button class="btn primary" type="submit" ${!db.people.length?'disabled':''}>Save moment</button><button class="btn" type="button" data-action="cancelMoment">Cancel</button></div></form>`}
function momentDetail(){let m=db.moments.find(x=>x.id===selected);if(!m){selected=null;return momentsPage()}return `<button class="back" data-action="backMoments">← All moments</button><div class="intro"><div><div class="muted small">${esc(day(m.date))}</div><h1>${esc((m.personIds||[]).map(pname).join(' & ')||'Moment')}</h1></div><button class="btn" data-action="editMoment">Edit</button></div><div class="card responsive"><h3>What happened</h3><p class="detail-note">${esc(m.text)}</p>${m.feeling?`<div class="divider"></div><h3>How I felt</h3><p>${esc(m.feeling)}</p>`:''}${m.reflection?`<div class="divider"></div><h3>Private reflection</h3><p class="detail-note">${esc(m.reflection)}</p>`:''}</div><div class="section"><button class="btn danger" data-delete-moment="${esc(m.id)}">Delete this moment</button></div>`}
function reflectPage(){let active=db.reminders.filter(r=>!r.done).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));let reflected=db.moments.filter(m=>m.feeling||m.reflection).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="intro"><div><h1>Reconnect & reflect.</h1><div class="muted">Relationships are personal. You set the pace.</div></div><button class="btn primary" data-action="newReminder">+ Set a reminder</button></div><div class="columns"><section><h2>Your follow-ups</h2>${active.length?`<div class="list">${active.map(r=>`<div class="item"><div><strong>${esc(pname(r.personId))}</strong><p class="reminder-text">${esc(r.text)}</p><div class="mini">${r.dueDate?esc(r.dueDate):'Anytime'}</div></div><div class="actions"><button class="btn" data-done="${esc(r.id)}">Done</button><button class="btn ghost" data-remove-reminder="${esc(r.id)}" aria-label="Delete reminder">×</button></div></div>`).join('')}</div>`:'<div class="empty">No reminders. That is perfectly fine.</div>'}</section><section><h2>Private reflections</h2>${reflected.length?`<div class="list">${reflected.map(m=>`<div class="item click" data-moment="${esc(m.id)}" role="button" tabindex="0"><div><strong>${esc((m.personIds||[]).map(pname).join(', '))}</strong><div class="mini">${esc(day(m.date))}</div><p class="detail-note">${esc(m.reflection||m.feeling)}</p></div><span class="muted">→</span></div>`).join('')}</div>`:'<div class="empty">Reflections are optional. Nothing to measure here.</div>'}</section></div>`}
function dataPage(){return `<div class="intro"><div><h1>Your data, your choice.</h1><div class="muted">Built to grow without leaving your memories behind.</div></div><span class="badge">Schema v${SCHEMA}</span></div><div class="notice"><strong>Important:</strong> This version stores data only in this browser on this device, not on a server. Private browsing, clearing site data, switching browsers, or moving this HTML file to a different address can make records inaccessible. Export a backup regularly and store it somewhere safe. This is a prototype, not a secure vault for highly sensitive information.</div><div class="cards section"><div class="card"><h3>Export everything</h3><p class="muted small">Download a JSON file containing people, moments, reminders, and future-compatible extra fields.</p><button class="btn primary" data-action="export">↓ Export JSON backup</button></div><div class="card"><h3>Import a backup</h3><p class="muted small">Restore a previous Fondly JSON backup. Existing data will be replaced only after confirmation.</p><button class="btn" data-action="import">↑ Import JSON</button></div><div class="card"><h3>Clear local data</h3><p class="muted small">Permanently delete this browser's Fondly records. Export first if you need a copy.</p><button class="btn danger" data-action="clear">Delete local records</button></div></div><section class="section card"><h3>Designed for future updates</h3><p>Every record has a stable ID and created/updated timestamps. Backups have a version number. New releases should introduce explicit migration steps instead of discarding older records. Extra fields in imported records are preserved by this prototype.</p><p class="muted small">Supported backup version: v1. Future versions must add migrations in code before reading new formats. If you try to import a newer unsupported version, the app rejects it without replacing your current data.</p></section><section class="section"><h2>What this version does not do</h2><p class="muted">No account, cloud sync, background notifications, automatic message reading, or AI analysis. Reminders appear inside Fondly when you open it.</p></section>`}
function reminderForm(preselected=''){let name=allPeople();if(!name.length){alert('Add a person first.');nav('people');editing='new';render();return}let wrap=document.createElement('div');wrap.id='reminderOverlay';wrap.style='position:fixed;inset:0;background:#30282188;display:grid;place-items:center;padding:15px;z-index:10';wrap.innerHTML=`<form id="reminderForm" class="card" style="width:min(100%,440px);box-shadow:0 15px 70px #0003"><h2>A gentle reminder.</h2><div class="field"><label>Person</label><select name="personId" required>${name.map(p=>`<option value="${esc(p.id)}" ${preselected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>What would you like to remember?</label><textarea name="text" required maxlength="300" placeholder="Ask about her trip…"></textarea></div><div class="field"><label>When? Optional</label><input type="date" name="dueDate"></div><div class="actions"><button type="submit" class="btn primary">Save reminder</button><button type="button" class="btn" id="closeReminder">Cancel</button></div></form>`;document.body.append(wrap);el('closeReminder').onclick=()=>wrap.remove();el('reminderForm').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target);let record={id:uid(),personId:v.get('personId'),text:String(v.get('text')).trim(),dueDate:v.get('dueDate')||'',done:false,createdAt:now(),updatedAt:now()};if(!record.text)return;db.reminders.push(record);persist();wrap.remove();tab='reflect';selected=null;render()};}
function savePerson(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;let fields={name,circle:String(f.get('circle')).trim(),howMet:String(f.get('howMet')).trim(),contact:String(f.get('contact')).trim(),family:String(f.get('family')).trim(),notes:String(f.get('notes')).trim()};if(editing==='edit'){let p=person(selected);Object.assign(p,fields,{updatedAt:now()})}else{selected=uid();db.people.push({id:selected,createdAt:now(),updatedAt:now(),...fields})}persist();editing=null;render()}
function saveMoment(e){e.preventDefault();let f=new FormData(e.target),ids=f.getAll('personIds'),text=String(f.get('text')).trim();if(!ids.length){alert('Select at least one person.');return}if(!text)return;let data={personIds:ids,date:f.get('date'),text,feeling:f.get('feeling')||'',reflection:String(f.get('reflection')).trim()};if(editing==='editMoment'){Object.assign(db.moments.find(m=>m.id===selected),data,{updatedAt:now()})}else{selected=uid();db.moments.push({id:selected,createdAt:now(),updatedAt:now(),...data})}let followText=String(f.get('followText')).trim();if(followText)db.reminders.push({id:uid(),personId:ids[0],momentId:selected,text:followText,dueDate:f.get('followDate')||'',done:false,createdAt:now(),updatedAt:now()});persist();editing=null;tab='moments';render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fondly-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bind(){if(el('personForm'))form('personForm',savePerson);if(el('momentForm'))form('momentForm',saveMoment);if(el('search'))el('search').oninput=e=>{search=e.target.value;let list=allPeople().filter(p=>(p.name+' '+(p.circle||'')+' '+(p.notes||'')).toLowerCase().includes(search.toLowerCase())&&(!circleFilter||p.circle===circleFilter));el('peopleResults').innerHTML=list.length?list.map(personRow).join(''):'<div class="empty">No matches.</div>'};if(el('circleFilter'))el('circleFilter').onchange=e=>{circleFilter=e.target.value;render();el('search')?.focus()};}
function clickAction(e){let target=e.target.closest('[data-tab],[data-action],[data-person],[data-moment],[data-done],[data-remove-reminder],[data-delete-person],[data-delete-moment]');if(!target)return;let d=target.dataset;if(d.tab){nav(d.tab);return}if(d.person){selected=d.person;editing=null;tab='people';render();return}if(d.moment){selected=d.moment;editing=null;tab='moments';render();return}if(d.done){let r=db.reminders.find(r=>r.id===d.done);if(r){r.done=true;r.updatedAt=now();persist();render()}return}if(d.removeReminder){if(confirm('Delete this reminder?')){db.reminders=db.reminders.filter(r=>r.id!==d.removeReminder);persist();render()}return}if(d.deletePerson){let p=person(d.deletePerson);if(p&&confirm('Delete '+p.name+'? Moments shared with other people will be kept, but this person will be removed from them. Sole-person moments and their reminders will be deleted. This cannot be undone.')){db.moments=db.moments.filter(m=>{m.personIds=(m.personIds||[]).filter(id=>id!==p.id);return m.personIds.length});db.reminders=db.reminders.filter(r=>r.personId!==p.id);db.people=db.people.filter(x=>x.id!==p.id);selected=null;persist();render()}return}if(d.deleteMoment){if(confirm('Delete this moment?')){db.moments=db.moments.filter(m=>m.id!==d.deleteMoment);db.reminders=db.reminders.filter(r=>r.momentId!==d.deleteMoment);selected=null;persist();render()}return}switch(d.action){case 'newPerson':tab='people';editing='new';selected=null;render();break;case 'editPerson':editing='edit';render();break;case 'cancelPerson':editing=null;render();break;case 'backPeople':selected=null;render();break;case 'newMoment':tab='moments';editing='newMoment';selected=null;render();break;case 'momentForPerson':tab='moments';editing='newMoment';render();break;case 'editMoment':editing='editMoment';render();break;case 'cancelMoment':editing=null;selected=null;render();break;case 'backMoments':selected=null;render();break;case 'goReflect':nav('reflect');break;case 'goMoments':nav('moments');break;case 'newReminder':reminderForm();break;case 'reminderForPerson':reminderForm(selected);break;case 'export':exportData();break;case 'import':el('importFile').click();break;case 'clear':{let entered=prompt('This will delete ALL locally stored Fondly records. Export a backup first. Type DELETE to confirm:');if(entered==='DELETE'){localStorage.removeItem(KEY);db=blank();tab='home';selected=null;editing=null;setNotice('Local records deleted.')}break}}}
document.addEventListener('click',clickAction);document.addEventListener('keydown',e=>{let n=e.target.closest('[data-person],[data-moment]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();n.click()}});el('topBackup').onclick=exportData;el('importFile').onchange=async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>15*1024*1024)throw Error('File is too large.');let imported=normalize(JSON.parse(await file.text()));if(!confirm('Replace this browser’s current '+db.people.length+' people and '+db.moments.length+' moments with the backup’s '+imported.people.length+' people and '+imported.moments.length+' moments? Export your current records first.'))return;let old=db;db=imported;if(!persist()){db=old;return}tab='home';selected=null;editing=null;setNotice('Backup imported successfully. Existing records were replaced.')}catch(err){alert('Import failed. Current records were not intentionally changed. '+err.message)}};render();
</script></body></html>
