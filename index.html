function datePlus(date,days){const x=new Date(date+'T12:00:00Z');if(Number.isNaN(x.getTime()))return '';x.setUTCDate(x.getUTCDate()+days);return x.toISOString().slice(0,10)}
function autoSuggestions(){const today=localDate();return db.people.flatMap(p=>{const days=Number(p.cadenceDays||0);if(![14,30,60,90].includes(days))return [];const last=recentFor(p.id);if(!last?.date)return [];const next=datePlus(last.date,days);if(!next||next>today||p.nextAutoReminderAfter>today)return [];if(pending().some(r=>r.personId===p.id&&r.dueDate&&r.dueDate<=today))return [];return [{person:p,last:last.date,next,days}];}).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,6)}
function historyForPerson(id){return db.statusHistory.filter(h=>h.personId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''))}
function statusChangeHTML(h){const source=h.momentId?`<button class="btn tiny-btn" data-moment="${esc(h.momentId)}">View moment →</button>`:'<span class="meta">Profile edit</span>';return `<div class="status-line"><div class="meta">${fmt(h.date)}</div>${(h.changes||[]).map(c=>`<div><strong>${esc(c.field==='closeness'?'Closeness':'Intention')}</strong>: ${esc(c.from||'Not set')} → ${esc(c.to||'Not set')}</div>`).join('')}<div style="margin-top:3px">${source}</div></div>`}
function recordStatus(person,values,source,date,momentId=''){const changes=[];for(const field of ['closeness','intention']){if(!Object.prototype.hasOwnProperty.call(values,field))continue;const from=person[field]||'',to=values[field]||'';if(from!==to){changes.push({field,from,to});person[field]=to;}}if(changes.length){db.statusHistory.push({id:uid(),personId:person.id,momentId,source,date,changes,createdAt:now()});person.updatedAt=now();}return changes.length;}
function dayNumber(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function dailyQuote(){let seed=2166136261;for(const c of db.createdAt||'fondly')seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;const a=encouragements.map((_,i)=>i);for(let i=a.length-1;i>0;i--){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;let j=(seed>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return encouragements[a[dayNumber()%a.length]];}

function refreshStatusSubject(form){if(!form)return;let box=form.querySelector('#statusSubject');if(!box)return;let ids=[...(form.querySelector('[data-people-picker]')?._selected||[])],select=box.querySelector('select[name="statusPersonId"]'),old=select.value;let chosen=ids.includes(old)?old:(ids.length===1?ids[0]:'');select.innerHTML='<option value="">'+(ids.length>1?'Choose one participant (optional)':'No one selected')+'</option>'+ids.map(id=>`<option value="${esc(id)}" ${id===chosen?'selected':''}>${esc(pname(id))}</option>`).join('');let p=getPerson(chosen);box.querySelector('.status-current').textContent=p?`Current: ${p.closeness||'No closeness'} · ${p.intention||'No intention'}`:'Optional: select someone above to record a change.';box.querySelectorAll('.status-update').forEach(el=>{el.disabled=!p});}

function bindPeoplePickers(){document.querySelectorAll('[data-people-picker]').forEach(node=>{let ids=[];try{ids=JSON.parse(node.dataset.selected||'[]')}catch{}node._selected=new Set(ids.filter(id=>!!getPerson(id)));refreshPeoplePicker(node);node.querySelector('.picker-search').addEventListener('input',()=>refreshPeoplePicker(node));node.querySelector('.picker-circle').addEventListener('change',()=>refreshPeoplePicker(node));node.querySelector('.picker-choices').addEventListener('change',e=>{if(!e.target.matches('.picker-check'))return;if(e.target.checked)node._selected.add(e.target.value);else node._selected.delete(e.target.value);refreshPeoplePicker(node)});node.querySelector('.picker-add-visible').addEventListener('click',()=>{node._visible.forEach(id=>node._selected.add(id));refreshPeoplePicker(node)});node.querySelector('.picker-clear').addEventListener('click',()=>{node._selected.clear();refreshPeoplePicker(node)});node.querySelector('.picker-chips').addEventListener('click',e=>{let b=e.target.closest('[data-remove-person]');if(b){node._selected.delete(b.dataset.removePerson);refreshPeoplePicker(node)}});});const status=document.querySelector('#statusSubject select[name="statusPersonId"]');if(status)status.addEventListener('change',()=>{let box=status.closest('#statusSubject'),p=getPerson(status.value);box.querySelector('.status-current').textContent=p?`Current: ${p.closeness||'No closeness'} · ${p.intention||'No intention'}`:'Choose a participant to record a change.';box.querySelectorAll('.status-update').forEach(el=>{el.disabled=!p});});}
function momentForm(){let m=selectedMoment?db.moments.find(x=>x.id===selectedMoment):{},ev=!m.id&&draftEventId?db.events.find(e=>e.id===draftEventId):null;let initialIds=m.personIds||(ev?.personIds|| (selectedPerson?[selectedPerson]:[]));let statusBox=m.id?'':`<div class="field full" id="statusSubject"><h3>Did a relationship change? · optional</h3><div class="meta" style="margin-bottom:6px">Only save a change you noticed, not a prediction. It will be linked to this moment.</div><select name="statusPersonId" aria-label="Person whose relationship changed"><option value="">Choose someone (optional)</option></select><div class="meta status-current" style="margin:6px 0">Choose a participant above to record a change.</div><div class="fields"><div class="field"><label class="label">Closeness after this moment</label><select class="status-update" name="newCloseness" disabled><option value="">Keep current</option>${closeOpts.slice(1).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}<option value="__clear__">Clear closeness</option></select></div><div class="field"><label class="label">Intention after this moment</label><select class="status-update" name="newIntention" disabled><option value="">Keep current</option>${intentOpts.slice(1).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}<option value="__clear__">Clear intention</option></select></div></div></div>`;return `<div class="wrap"><button class="back" data-action="cancelMoment">← Moments</button>${pageHeading('ONE SENTENCE IS ENOUGH',m.id?'Edit moment':'Capture a moment')}<form id="momentForm" class="card form"><div class="fields"><div class="field full"><label class="label">Who was there? *</label>${peopleChecks(initialIds)}<div class="meta" style="margin-top:5px">Search by name, filter by circle, or add everyone shown. You can select multiple people.</div></div><div class="field"><label class="label">Date *</label><input name="date" type="date" required value="${esc(m.date||ev?.date||localDate())}"></div><div class="field"><label class="label">Interaction type · for goal tracking</label><select name="kind">${[['','Choose type (or skip)'],['inPerson','In person'],['call','Call'],['message','Message'],['event','Event / gathering'],['other','Other']].map(([v,n])=>`<option value="${v}" ${(m.kind||(ev?'event':''))===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field full"><label class="label">What happened? *</label><textarea name="text" required maxlength="20000" placeholder="We chatted about…">${esc(m.text||'')}</textarea></div><div class="field"><label class="label">How did it feel? · private</label><select name="feeling">${opt(['','Lovely','Good','Neutral','Draining','Mixed'],m.feeling||'')}</select></div><div class="field full"><label class="label">What did I learn or notice? · optional</label><select name="insightTopic" style="margin-bottom:6px">${[['','Pick a topic (optional)'],['them','About them'],['myself','About myself'],['conversation','Conversation ideas'],['patterns','Relationship patterns'],['other','Other']].map(([value,title])=>`<option value="${value}" ${m.insightTopic===value?'selected':''}>${title}</option>`).join('')}</select><textarea name="insight" maxlength="4000" placeholder="About this person, about friendship, or about myself…">${esc(m.insight||'')}</textarea></div><div class="field full"><label class="label">Anything else to reflect on? · optional</label><textarea name="reflection">${esc(m.reflection||'')}</textarea></div>${statusBox}</div><hr class="divider"><h3>Optional follow-up</h3><div class="fields"><div class="field full"><label class="label">Who should this follow-up be about?</label><select name="followPersonId" aria-label="Follow-up person"><option value="">Choose a participant</option></select></div><div class="field"><label class="label">Remember to…</label><input name="followText" maxlength="300" placeholder="Ask about her move…"></div><div class="field"><label class="label">Reminder date</label><input name="followDate" type="date"></div></div><p class="muted tiny">Fondly shows reminders when open, not as phone push notifications when closed.</p><div class="buttons"><button type="submit" class="btn primary" ${db.people.length?'':'disabled'}>Save moment</button><button type="button" class="btn" data-action="cancelMoment">Cancel</button></div></form></div>`;}
function momentDetail(){let m=db.moments.find(x=>x.id===selectedMoment);if(!m){selectedMoment='';return logPage()}return `<div class="wrap"><button class="back" data-action="backMoments">← Moments</button><div class="heading"><div><div class="eyebrow">${fmt(m.date)} · ${esc(kindLabel(m.kind))}</div><h1>${esc(momentPeople(m))}</h1></div><button class="btn tiny-btn" data-action="editMoment">Edit</button></div><div class="card"><h3>What happened</h3><div class="detail">${esc(m.text)}</div>${m.feeling?`<hr class="divider"><div class="meta">Feeling · ${esc(m.feeling)}</div>`:''}${m.insight?`<hr class="divider"><h3>✦ Something I learned</h3><div class="note">${m.insightTopic?`<div class="meta">${esc(insightTopicLabel(m.insightTopic))}</div>`:''}${esc(m.insight)}</div>`:''}${m.reflection?`<hr class="divider"><h3>Private reflection</h3><div class="detail">${esc(m.reflection)}</div>`:''}${db.statusHistory.some(h=>h.momentId===m.id)?`<hr class="divider"><h3>Relationship changes you recorded</h3>${db.statusHistory.filter(h=>h.momentId===m.id).map(h=>`<div class="sm"><strong>${esc(pname(h.personId))}</strong>${(h.changes||[]).map(c=>`<div>${esc(c.field)}: ${esc(c.from||'Not set')} → ${esc(c.to||'Not set')}</div>`).join('')}</div>`).join('')}`:''}</div><button class="btn danger tiny-btn" data-action="deleteMoment">Delete moment</button></div>`;}
function circlesPage(){if(mode==='circleForm')return circleForm();if(mode==='eventForm')return eventForm();if(selectedEvent)return eventDetail();if(selectedCircle)return circleDetail();let up=nextEvents();return `<div class="wrap">${pageHeading('BEFORE YOU WALK IN','Circles & social prep',`<button class="btn primary tiny-btn" data-action="newEvent">${ic('plus')} Social</button>`)}<div class="card sage"><strong>Going to a social?</strong><div class="sm muted">Make a one-time prep list. See who might be there and what you last talked about.</div></div><div class="sectionhead"><h2>Upcoming events</h2><button class="btn tiny-btn" data-action="newEvent">+ Plan event</button></div>${up.length?`<div class="list">${up.map(ev=>`<div class="rowcard clickable" data-event="${esc(ev.id)}" role="button" tabindex="0"><div class="grow"><strong>${esc(ev.name)}</strong><div class="meta">${fmt(ev.date)} · ${(ev.personIds||[]).length} people</div></div>${ic('chevron')}</div>`).join('')}</div>`:'<div class="empty">No upcoming events. Create one to prepare for a dinner, party or school gathering.</div>'}<div class="sectionhead section"><h2>Your circles</h2><button class="btn tiny-btn" data-action="newCircle">+ Circle</button></div>${db.circles.length?`<div class="list">${db.circles.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<div class="rowcard clickable" data-circle="${esc(c.id)}" role="button" tabindex="0"><div class="grow"><strong>${esc(c.name)}</strong><div class="meta">${db.people.filter(p=>(p.circleIds||[]).includes(c.id)).length} people</div></div>${ic('chevron')}</div>`).join('')}</div>`:'<div class="empty">Create a circle such as School, Hockey or Old friends.</div>'}<div class="sectionhead section"><h2>Past prep lists</h2></div>${db.events.filter(e=>e.date<localDate()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(e=>`<div class="rowcard clickable" data-event="${esc(e.id)}" role="button" tabindex="0"><div class="grow"><strong>${esc(e.name)}</strong><div class="meta">${fmt(e.date)}</div></div>${ic('chevron')}</div>`).join('')||'<div class="empty">No past events yet.</div>'}</div>`;}
function circleForm(){let c=selectedCircle?db.circles.find(x=>x.id===selectedCircle):{};return `<div class="wrap"><button class="back" data-action="cancelCircle">← Circles</button>${pageHeading('ORGANIZE YOUR PEOPLE',c.id?'Edit circle':'New circle')}<form id="circleForm" class="card form"><div class="field"><label class="label">Circle name *</label><input name="name" required maxlength="120" value="${esc(c.name||'')}" placeholder="e.g. School parents"></div><div class="field" style="margin-top:10px"><label class="label">Notes (optional)</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><div class="buttons"><button type="submit" class="btn primary">Save circle</button><button type="button" class="btn" data-action="cancelCircle">Cancel</button></div></form></div>`;}
function circleDetail(){let c=db.circles.find(x=>x.id===selectedCircle);if(!c){selectedCircle='';return circlesPage()}let ppl=allPeople().filter(p=>(p.circleIds||[]).includes(c.id));return `<div class="wrap"><button class="back" data-action="backCircles">← Circles</button>${pageHeading('YOUR CIRCLE',esc(c.name),`<button class="btn tiny-btn" data-action="editCircle">Edit</button>`)}${c.notes?`<div class="note">${esc(c.notes)}</div>`:''}<div class="sectionhead section"><h2>People · ${ppl.length}</h2><button class="btn tiny-btn primary" data-action="eventFromCircle">${ic('calendar')} Prep an event</button></div>${ppl.length?`<div class="list">${ppl.map(personPrepRow).join('')}</div>`:'<div class="empty">Edit a profile to add someone to this circle.</div>'}<button style="margin-top:15px" class="btn tiny-btn danger" data-action="deleteCircle">Delete circle (keep people)</button></div>`;}
function personPrepRow(p){let m=recentFor(p.id);return `<div class="prepperson"><div class="buttons" style="justify-content:space-between"><strong>${esc(p.name)}</strong><button class="btn tiny-btn" data-person="${esc(p.id)}">Profile →</button></div><div class="meta">${esc(p.closeness||'No closeness set')} ${p.family?'· '+esc(p.family.slice(0,120)):''}</div>${p.notes?`<div class="sm detail">Remember: ${esc(p.notes.slice(0,230))}</div>`:''}<div class="sm detail" style="margin-top:4px">${m?`Last ${fmt(m.date)}: ${esc(m.text.slice(0,240))}`:'No recorded interactions yet.'}</div>${m?.insight?`<div class="meta">✦ ${esc(m.insight.slice(0,180))}</div>`:''}</div>`;}
function eventForm(){let e=selectedEvent?db.events.find(x=>x.id===selectedEvent):{};let ids=e.personIds|| (selectedCircle?db.people.filter(p=>(p.circleIds||[]).includes(selectedCircle)).map(p=>p.id):[]);return `<div class="wrap"><button class="back" data-action="cancelEvent">← Circles</button>${pageHeading('GET READY WITHOUT OVERTHINKING',e.id?'Edit social':'Plan a social')}<form id="eventForm" class="card form"><div class="fields"><div class="field"><label class="label">Event name *</label><input name="name" maxlength="150" required value="${esc(e.name||'')}" placeholder="Friday school coffee"></div><div class="field"><label class="label">Date *</label><input name="date" type="date" required value="${esc(e.date||localDate())}"></div><div class="field full"><label class="label">Who's likely to be there?</label>${peopleChecks(ids)}</div><div class="field full"><label class="label">Your notes / context · optional</label><textarea name="notes" placeholder="Where, why, anything to remember…">${esc(e.notes||'')}</textarea></div></div><div class="buttons"><button class="btn primary" type="submit">Save prep list</button><button class="btn" type="button" data-action="cancelEvent">Cancel</button></div></form></div>`;}
function eventDetail(){let ev=db.events.find(e=>e.id===selectedEvent);if(!ev){selectedEvent='';return circlesPage()}let people=(ev.personIds||[]).map(getPerson).filter(Boolean);return `<div class="wrap"><button class="back" data-action="backCircles">← Circles</button><div class="heading"><div><div class="eyebrow">${fmt(ev.date)} · SOCIAL PREP</div><h1>${esc(ev.name)}</h1></div><button class="btn tiny-btn" data-action="editEvent">Edit</button></div>${ev.notes?`<div class="card warm detail">${esc(ev.notes)}</div>`:''}<div class="sectionhead"><h2>People to remember · ${people.length}</h2></div>${people.length?people.map(personPrepRow).join(''):'<div class="empty">Edit this event to add people to your prep list.</div>'}${db.moments.some(m=>m.eventId===ev.id)?`<section class="section"><div class="sectionhead"><h2>Moments from this social</h2></div><div class="list">${db.moments.filter(m=>m.eventId===ev.id).map(momentRow).join('')}</div></section>`:''}<div class="buttons section"><button class="btn primary" data-action="logFromEvent">${ic('log')} Log a moment</button><button class="btn danger tiny-btn" data-action="deleteEvent">Delete prep list</button></div></div>`;}
function reviewPage(){let navs=[['overview','Overview'],['goals','Goals'],['learn','Learning'],['data','Data & backup']];let head=`<div class="wrap">${pageHeading('REFLECT, DON’T GRADE','Review')}<div class="review-tabs">${navs.map(([k,v])=>`<button class="btn tiny-btn ${subTab===k?'active':''}" data-subtab="${k}">${v}</button>`).join('')}</div>`;let inner=subTab==='goals'?goalsPage():subTab==='learn'?learningPage():subTab==='data'?dataPage():overviewPage();return head+inner+'</div>';}
function monthSelect(){let d=new Date(),options=[];for(let i=0;i<13;i++){let dt=new Date(d.getFullYear(),d.getMonth()-i,1),s=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;options.push(`<option value="${s}" ${s===reviewMonth?'selected':''}>${dt.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</option>`)}return `<select id="reviewMonth" style="max-width:220px">${options.join('')}</select>`;}
let reviewMonth=localMonth();
function overviewPage(){let mm=monthMoments(reviewMonth),uniqueMet=new Set(mm.filter(m=>m.kind==='inPerson'||m.kind==='event').flatMap(m=>m.personIds));let insights=mm.filter(m=>m.insight).length,r=reviewFor(reviewMonth);let feelings={};for(let m of mm)if(m.feeling)feelings[m.feeling]=(feelings[m.feeling]||0)+1;return `<div class="controls" style="margin-bottom:11px">${monthSelect()}</div><div class="stats"><div class="stat"><div class="num">${uniqueMet.size}</div><div class="meta">People met in person</div></div><div class="stat"><div class="num">${mm.length}</div><div class="meta">Moments logged</div></div><div class="stat"><div class="num">${insights}</div><div class="meta">Learnings saved</div></div></div><p class="muted tiny">Counts reflect only what you explicitly logged and categorized; missing records are not inferred.</p><div class="card"><h3>What your records show</h3><div class="sm">${mm.length?`You logged ${mm.length} moments this month. ${uniqueMet.size} distinct people appear in in-person records.`:'No moments logged for this month yet.'}</div>${Object.keys(feelings).length?`<div class="meta" style="margin-top:6px">Your selected feelings: ${Object.entries(feelings).map(([k,v])=>esc(k)+': '+v).join(' · ')}</div>`:''}</div><div class="sectionhead section"><h2>Relationship changes</h2><span class="meta">${db.statusHistory.filter(h=>(h.date||'').slice(0,7)===reviewMonth).length} recorded</span></div>${db.statusHistory.filter(h=>(h.date||'').slice(0,7)===reviewMonth).length?`<div class="status-history" style="margin-bottom:12px">${db.statusHistory.filter(h=>(h.date||'').slice(0,7)===reviewMonth).sort((a,b)=>b.date.localeCompare(a.date)).map(h=>`<div class="status-line"><strong>${esc(pname(h.personId))}</strong> · ${fmt(h.date)}${(h.changes||[]).map(c=>`<div>${esc(c.field)}: ${esc(c.from||'Not set')} → ${esc(c.to||'Not set')}</div>`).join('')}${h.momentId?`<button class="btn tiny-btn" data-moment="${esc(h.momentId)}">Linked moment →</button>`:''}</div>`).join('')}</div>`:'<p class="meta">No relationship changes recorded this month. Previous labels are not reconstructed or guessed.</p>'}<div class="sectionhead"><h2>Monthly reflection</h2><span class="pill">Private</span></div><form id="reviewForm" class="card form"><div class="field"><label class="label">What worked well socially?</label><textarea name="worked" placeholder="A situation where I felt comfortable…">${esc(r?.worked||'')}</textarea></div><div class="field" style="margin-top:9px"><label class="label">What did I learn about myself or my friendships?</label><textarea name="learned" placeholder="A pattern I noticed, without judging anyone…">${esc(r?.learned||'')}</textarea></div><div class="field" style="margin-top:9px"><label class="label">What would I like to try next month?</label><textarea name="nextTry" placeholder="One small, realistic idea…">${esc(r?.nextTry||'')}</textarea></div><div class="buttons"><button type="button" class="btn subtle" data-action="draftLearning">✦ Draft from my notes</button><button type="submit" class="btn primary">Save monthly reflection</button><button class="btn" type="button" data-subtab="learn">Read learning library →</button></div></form></div>`;}
function goalsPage(){let goals=db.goals.filter(g=>g.month===reviewMonth);return `<div class="controls" style="margin-bottom:10px">${monthSelect()}<button class="btn primary tiny-btn" data-action="newGoal">${ic('plus')} Goal</button></div><div class="card sage"><strong>A gentle direction, not a score.</strong><div class="muted sm">Choose targets that make your social life better. Meeting goals count distinct people explicitly logged as “In person” or “Event / gathering.”</div></div>${goals.length?`<div class="list">${goals.map(g=>{let n=progress(g),pct=Math.min(100,Math.round(n/Math.max(1,g.target)*100));return `<div class="card"><div class="heading" style="margin-bottom:0"><strong>${esc(g.label||goalTypeLabel(g.type))}</strong><span class="meta">${n} / ${g.target}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="mutedline">${esc(goalTypeLabel(g.type))}${g.type==='custom'?' · manually updated':''}</div><div class="buttons" style="margin-top:7px">${g.type==='custom'?`<button class="btn tiny-btn" data-action="progressGoal" data-id="${esc(g.id)}">Update progress</button>`:''}<button class="btn tiny-btn danger" data-action="deleteGoal" data-id="${esc(g.id)}">Remove</button></div></div>`}).join('')}</div>`:'<div class="empty">Choose one or two realistic intentions for this month.</div>'}<p class="muted tiny">Goals update from new records; old moments with no interaction type are never guessed to be in-person meetups.</p>`;}
function goalTypeLabel(t){return ({meet:'Distinct people seen in person',reach:'Distinct people called or messaged',followup:'Follow-ups completed',custom:'Custom / manual'})[t]||t;}
function learningPage(){let insights=db.moments.filter(m=>m.insight?.trim()).sort((a,b)=>b.date.localeCompare(a.date));let reviews=db.reviews.filter(r=>r.learned?.trim()||r.worked?.trim()||r.nextTry?.trim()).sort((a,b)=>b.month.localeCompare(a.month));return `<div class="card sage"><strong>Learning library</strong><div class="muted sm">Only things you wrote. Fondly never invents lessons or diagnoses your relationships.</div></div><div class="sectionhead"><h2>Things you noticed · ${insights.length}</h2><button class="btn tiny-btn" data-action="newMoment">+ Add learning</button></div>${insights.length?`<div class="card"><h3>Topics from your notes</h3><div class="choicegrid">${[...new Set(insights.map(m=>insightTopicLabel(m.insightTopic)))].map(t=>`<span class="pill green">${esc(t)} · ${insights.filter(m=>insightTopicLabel(m.insightTopic)===t).length}</span>`).join('')}</div><p class="tiny muted">Topics are the categories you chose; no inferred labels.</p></div><div class="timeline">${insights.map(m=>`<div class="card clickable" data-moment="${esc(m.id)}" role="button" tabindex="0"><div class="meta">${fmt(m.date)} · ${esc(momentPeople(m))}</div><div class="meta">${esc(insightTopicLabel(m.insightTopic))}</div><div class="detail sm">✦ ${esc(m.insight)}</div></div>`).join('')}</div>`:'<div class="empty">After a meeting, note one thing you learned or noticed. It will appear here.</div>'}<div class="sectionhead section"><h2>Monthly takeaways</h2></div>${reviews.length?reviews.map(r=>`<div class="card"><strong>${esc(r.month)}</strong>${r.worked?`<div class="sm detail"><span class="meta">Worked:</span> ${esc(r.worked)}</div>`:''}${r.learned?`<div class="sm detail"><span class="meta">Learned:</span> ${esc(r.learned)}</div>`:''}${r.nextTry?`<div class="sm detail"><span class="meta">Next:</span> ${esc(r.nextTry)}</div>`:''}</div>`).join(''):'<div class="empty">Save a monthly reflection in Review → Overview to build your own takeaways.</div>'}</div>`;}
function dataPage(){return `<div class="notice"><strong>Your data is local.</strong> It stays in this browser at this exact site address. Automatic check-in suggestions appear only when opened. No cross-device sync, remote backup, background push notifications or AI. Clearing site data can erase records; export JSON regularly.</div><div class="card"><h3>Data & backup · schema v${SCHEMA}</h3><p class="sm muted">Export includes people, moments, reminders, circles, events, goals, reflections, relationship-change history and preserved extra fields.</p><div class="exportbuttons"><button class="btn primary" data-action="export">↓ Export all JSON</button><button class="btn" data-action="import">↑ Import JSON</button></div><p class="tiny muted">Import replaces local data only after confirmation. Export your current records first. Both v0.1 and v0.2 backups are supported.</p></div><div class="card"><h3>Upgrade safety</h3><div class="sm">The old <code>fondly.data.v1</code> browser key is unchanged. An original v0.1 snapshot (if present) is kept. The first save of v0.3 attempts a v0.2 snapshot if storage has space. Export a JSON backup before updating.</div>${localStorage.getItem(PRE_V2_KEY)?'<div class="buttons" style="margin-top:9px"><button class="btn tiny-btn" data-action="exportOld">↓ Export pre-v0.2 snapshot</button></div>':'<div class="meta">No pre-v0.2 snapshot found (new install or no v0.1 snapshot).</div>'}${localStorage.getItem(PRE_V3_KEY)?'<div class="buttons" style="margin-top:8px"><button class="btn tiny-btn" data-action="exportV2">↓ Export pre-v0.3 snapshot</button></div>':'<div class="meta">No pre-v0.3 snapshot yet (or storage space unavailable).</div>'}</div><div class="card dangerzone"><h3>Clear local records</h3><p class="sm muted">Delete this browser’s Fondly records only. This cannot be undone without a backup.</p><button class="btn danger" data-action="clear">Delete local records</button></div><p class="footerline">Version 0.3 · Format v3 · No account or cloud sync. Avoid entering sensitive third-party information you do not need.</p>`;}
function render(){let root=document.getElementById('view');if(loadError){root.innerHTML=`<div class="wrap"><h1>Storage needs attention</h1><div class="notice">Your existing local records could not be read: ${esc(loadError)}. Fondly will not overwrite them. Export the original storage before restoring a backup.</div><button class="btn primary" data-action="exportRaw">↓ Export unreadable original</button> <button class="btn" data-action="import">↑ Import valid backup</button></div>`;return;}document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});root.innerHTML=(toast?`<div class="toast" role="status">${esc(toast)}</div>`:'')+(tab==='people'?peoplePage():tab==='log'?logPage():tab==='circles'?circlesPage():tab==='review'?reviewPage():home());bind();}
function bind(){const form=(id,fn)=>{let e=document.getElementById(id);if(e)e.addEventListener('submit',fn)};form('personForm',savePerson);form('momentForm',saveMoment);form('circleForm',saveCircle);form('eventForm',saveEvent);form('reviewForm',saveReview);bindPeoplePickers();let se=document.getElementById('search');if(se)se.addEventListener('input',e=>{search=e.target.value;document.getElementById('peopleResults').innerHTML=filteredPeople().map(personRow).join('')||'<div class="empty">No matches.</div>'});for(let name of ['circleFilter','closenessFilter']){let node=document.getElementById(name);if(node)node.addEventListener('change',e=>{if(name==='circleFilter')circleFilter=e.target.value;else closenessFilter=e.target.value;render()})}let mon=document.getElementById('reviewMonth');if(mon)mon.addEventListener('change',e=>{reviewMonth=e.target.value;render()});}
function savePerson(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;let existing=selectedPerson?getPerson(selectedPerson):null;let closeness=String(f.get('closeness')||''),intention=String(f.get('intention')||'');let changes={name,contact:String(f.get('contact')||'').trim(),circleIds:f.getAll('circleIds'),howMet:String(f.get('howMet')||'').trim(),family:String(f.get('family')||'').trim(),notes:String(f.get('notes')||'').trim(),cadenceDays:Number(f.get('cadenceDays')||0)};if(![0,14,30,60,90].includes(changes.cadenceDays))changes.cadenceDays=0;if(existing){recordStatus(existing,{closeness,intention},'profile',localDate());if(existing.cadenceDays!==changes.cadenceDays)existing.nextAutoReminderAfter='';Object.assign(existing,changes,{updatedAt:now()});}else{selectedPerson=uid();db.people.push({id:selectedPerson,createdAt:now(),updatedAt:now(),circle:'',closeness,intention,nextAutoReminderAfter:'',...changes})}if(persist()){mode='';msg('Person saved.')}}
function saveMoment(e){e.preventDefault();let f=new FormData(e.target),ids=f.getAll('personIds'),text=String(f.get('text')||'').trim();if(!ids.length||!text){alert('Choose at least one person and add a moment.');return;}let follow=String(f.get('followText')||'').trim(),followId=String(f.get('followPersonId')||'');if(follow&&!ids.includes(followId)){alert('Please choose which person the follow-up is about.');return;}let m=selectedMoment?db.moments.find(x=>x.id===selectedMoment):null;let changes={personIds:ids,date:String(f.get('date')||localDate()),kind:String(f.get('kind')||''),text,feeling:String(f.get('feeling')||''),insight:String(f.get('insight')||'').trim(),insightTopic:String(f.get('insightTopic')||''),reflection:String(f.get('reflection')||'').trim()};if(m)Object.assign(m,changes,{updatedAt:now()});else{selectedMoment=uid();m={id:selectedMoment,createdAt:now(),updatedAt:now(),eventId:draftEventId||'',...changes};db.moments.push(m);let personId=String(f.get('statusPersonId')||'');let target=ids.includes(personId)?getPerson(personId):null;if(target){let values={};for(let [key,field] of [['newCloseness','closeness'],['newIntention','intention']]){let value=String(f.get(key)||'');if(value)values[field]=value==='__clear__'?'':value;}recordStatus(target,values,'moment',m.date,m.id);}}if(follow)db.reminders.push({id:uid(),personId:followId,momentId:selectedMoment,text:follow,dueDate:String(f.get('followDate')||''),done:false,completedAt:'',createdAt:now(),updatedAt:now()});if(persist()){draftEventId='';mode='';tab='log';msg('Moment saved. Your notes and any relationship changes are in Review.')}}
function saveCircle(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;let existing=selectedCircle?db.circles.find(c=>c.id===selectedCircle):null;if(db.circles.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==existing?.id)){alert('A circle with this name already exists.');return}let changes={name,notes:String(f.get('notes')||'').trim()};if(existing)Object.assign(existing,changes,{updatedAt:now()});else{selectedCircle=uid();db.circles.push({id:selectedCircle,createdAt:now(),updatedAt:now(),...changes})}if(persist()){mode='';msg('Circle saved.')}}
function saveEvent(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;let existing=selectedEvent?db.events.find(ev=>ev.id===selectedEvent):null;let changes={name,date:String(f.get('date')||localDate()),personIds:f.getAll('personIds'),notes:String(f.get('notes')||'').trim()};if(existing)Object.assign(existing,changes,{updatedAt:now()});else{selectedEvent=uid();db.events.push({id:selectedEvent,createdAt:now(),updatedAt:now(),...changes})}if(persist()){mode='';tab='circles';msg('Social prep list saved.')}}
function saveReview(e){e.preventDefault();let f=new FormData(e.target),changes={worked:String(f.get('worked')||'').trim(),learned:String(f.get('learned')||'').trim(),nextTry:String(f.get('nextTry')||'').trim()};let r=reviewFor(reviewMonth);if(r)Object.assign(r,changes,{updatedAt:now()});else db.reviews.push({id:uid(),month:reviewMonth,createdAt:now(),updatedAt:now(),...changes});if(persist())msg('Reflection saved. Find your takeaways in Learning.');}
function exportObject(obj,filename){let url=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function modal(title,html,onSubmit){let root=document.getElementById('modalRoot');root.innerHTML=`<div class="overlay"><div class="modal"><div class="heading"><h2>${title}</h2><button class="btn tiny-btn" data-action="closeModal" aria-label="Close">×</button></div><form id="modalForm">${html}</form></div></div>`;document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();onSubmit(new FormData(e.target))});}
function reminderModal(id=''){if(!db.people.length){go('people');mode='personForm';render();alert('Add someone first.');return;}modal('A gentle reminder',`<div class="field"><label class="label">Person</label><select name="personId">${allPeople().map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label class="label">What would you like to remember? *</label><textarea name="text" required maxlength="300" placeholder="Ask how her trip went…"></textarea></div><div class="field" style="margin-top:10px"><label class="label">When? (optional)</label><input name="dueDate" type="date"></div><p class="muted tiny">Reminder appears in Fondly when you open it. No push notifications.</p><button class="btn primary" type="submit">Save reminder</button>`,f=>{let text=String(f.get('text')||'').trim();if(!text)return;db.reminders.push({id:uid(),personId:String(f.get('personId')),text,dueDate:String(f.get('dueDate')||''),done:false,completedAt:'',createdAt:now(),updatedAt:now()});if(persist()){document.getElementById('modalRoot').innerHTML='';msg('Reminder saved. It will appear on Home when due.')}});}
function goalModal(){modal('Set a gentle goal',`<div class="field"><label class="label">Month</label><input value="${esc(reviewMonth)}" readonly></div><div class="field" style="margin-top:9px"><label class="label">Goal type</label><select name="type">${['meet','reach','followup','custom'].map(t=>`<option value="${t}">${esc(goalTypeLabel(t))}</option>`).join('')}</select></div><div class="field" style="margin-top:9px"><label class="label">Goal name (optional)</label><input name="label" maxlength="150" placeholder="e.g. See four friends"></div><div class="field" style="margin-top:9px"><label class="label">Target *</label><input name="target" type="number" min="1" max="10000" value="4" required></div><p class="muted tiny">Meeting/outreach goals count distinct people in categorized moments; follow-ups count completed reminders. Custom goals use manual progress.</p><button type="submit" class="btn primary">Save goal</button>`,f=>{let target=Number(f.get('target'));if(!Number.isInteger(target)||target<1||target>10000)return;db.goals.push({id:uid(),month:reviewMonth,type:String(f.get('type')),label:String(f.get('label')||'').trim(),target,progress:0,createdAt:now(),updatedAt:now()});if(persist()){document.getElementById('modalRoot').innerHTML='';msg('Goal saved.')}});}
function handleClick(e){let b=e.target.closest('[data-tab],[data-subtab],[data-action],[data-person],[data-moment],[data-circle],[data-event]');if(!b)return;let d=b.dataset;if(d.tab){go(d.tab);return}if(d.subtab){subTab=d.subtab;render();return}if(d.person){selectedPerson=d.person;mode='';tab='people';render();return}if(d.moment){selectedMoment=d.moment;mode='';tab='log';render();return}if(d.circle){selectedCircle=d.circle;mode='';tab='circles';render();return}if(d.event){selectedEvent=d.event;mode='';tab='circles';render();return}switch(d.action){case 'draftLearning':{let text=monthMoments(reviewMonth).filter(m=>m.insight?.trim()).sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`• ${m.date} · ${momentPeople(m)} [${insightTopicLabel(m.insightTopic)}]: ${m.insight}`).join('\n');if(!text){alert('No learning notes for this month yet. Capture an insight in Log first.');break}let target=document.querySelector('#reviewForm [name="learned"]');if(target){target.value=(target.value?target.value.trim()+'\n\n':'')+'Notes to synthesize (my own words):\n'+text;target.focus();}break;}case 'newPerson':selectedPerson='';mode='personForm';tab='people';render();break;case 'editPerson':mode='personForm';render();break;case 'cancelPerson':mode='';render();break;case 'backPeople':selectedPerson='';mode='';render();break;case 'newMoment':draftEventId='';selectedMoment='';selectedPerson='';mode='momentForm';tab='log';render();break;case 'momentForPerson':draftEventId='';selectedMoment='';mode='momentForm';tab='log';render();break;case 'editMoment':draftEventId='';mode='momentForm';render();break;case 'cancelMoment':draftEventId='';selectedMoment='';mode='';tab='log';render();break;case 'backMoments':selectedMoment='';mode='';render();break;case 'newCircle':selectedCircle='';mode='circleForm';tab='circles';render();break;case 'editCircle':mode='circleForm';render();break;case 'cancelCircle':mode='';render();break;case 'backCircles':selectedCircle='';selectedEvent='';mode='';render();break;case 'newEvent':selectedEvent='';selectedCircle='';mode='eventForm';tab='circles';render();break;case 'eventFromCircle':selectedEvent='';mode='eventForm';render();break;case 'editEvent':mode='eventForm';render();break;case 'cancelEvent':mode='';render();break;case 'logFromEvent':{draftEventId=selectedEvent;selectedPerson='';selectedMoment='';mode='momentForm';tab='log';render();break;}case 'autoSnooze':{let person=getPerson(d.id);if(person){person.nextAutoReminderAfter=datePlus(localDate(),7);if(persist())msg('Suggested check-in moved to next week.')}break;}case 'autoDone':{let person=getPerson(d.id);if(person){person.nextAutoReminderAfter=datePlus(localDate(),Number(person.cadenceDays)||30);if(persist())msg('Got it. No interaction has been added to your log.')}break;}case 'autoOff':{let person=getPerson(d.id);if(person){person.cadenceDays=0;person.nextAutoReminderAfter='';if(persist())msg('Automatic suggestions turned off for this person.')}break;}case 'newReminder':reminderModal();break;case 'reminderForPerson':reminderModal(selectedPerson);break;case 'showReminders':{let list=pending();modal('All open reminders',`<div class="list">${list.map(r=>`<div class="rowcard"><div class="grow"><strong>${esc(pname(r.personId))}</strong><div class="sm">${esc(r.text)}</div><div class="meta">${r.dueDate?fmt(r.dueDate):'Anytime'}</div></div><button class="btn tiny-btn" type="button" data-action="doneReminder" data-id="${esc(r.id)}">Done</button><button class="btn danger tiny-btn" type="button" data-action="deleteReminder" data-id="${esc(r.id)}">×</button></div>`).join('')||'<div class="empty">No open reminders.</div>'}</div><div class="buttons" style="margin-top:10px"><button class="btn" type="button" data-action="closeModal">Close</button></div>`,()=>{});break;}case 'doneReminder':{let r=db.reminders.find(x=>x.id===d.id);if(r){r.done=true;r.completedAt=now();r.updatedAt=now();if(persist()){document.getElementById('modalRoot').innerHTML='';msg('Follow-up completed.')}}break;}case 'deleteReminder':{if(confirm('Delete this reminder?')){db.reminders=db.reminders.filter(r=>r.id!==d.id);if(persist()){document.getElementById('modalRoot').innerHTML='';render()}}break;}case 'newGoal':goalModal();break;case 'progressGoal':{let g=db.goals.find(x=>x.id===d.id);if(!g)return;modal('Update progress',`<div class="field"><label class="label">${esc(g.label||goalTypeLabel(g.type))}</label><input name="progress" type="number" min="0" max="10000" required value="${g.progress||0}"></div><div class="buttons" style="margin-top:10px"><button type="submit" class="btn primary">Save</button></div>`,f=>{let n=Number(f.get('progress'));if(!Number.isInteger(n)||n<0||n>10000)return;g.progress=n;g.updatedAt=now();if(persist()){document.getElementById('modalRoot').innerHTML='';render()}});break;}case 'deleteGoal':{if(confirm('Remove this goal?')){db.goals=db.goals.filter(g=>g.id!==d.id);if(persist())render()}break;}case 'deleteCircle':{if(confirm('Delete circle? All people and moments will remain; only their membership in this circle is removed.')){db.circles=db.circles.filter(c=>c.id!==selectedCircle);db.people.forEach(p=>p.circleIds=p.circleIds.filter(id=>id!==selectedCircle));selectedCircle='';if(persist())render()}break;}case 'deleteEvent':{if(confirm('Delete this prep list? People and moments are kept.')){db.events=db.events.filter(ev=>ev.id!==selectedEvent);selectedEvent='';if(persist())render()}break;}case 'deletePerson':{let p=getPerson(selectedPerson);if(p&&confirm(`Delete ${p.name}? Sole-person moments and reminders will be deleted; shared moments will keep the other people. This cannot be undone.`)){db.moments=db.moments.filter(m=>{m.personIds=m.personIds.filter(id=>id!==p.id);return m.personIds.length>0});db.reminders=db.reminders.filter(r=>r.personId!==p.id);db.statusHistory=db.statusHistory.filter(h=>h.personId!==p.id);db.events.forEach(ev=>ev.personIds=ev.personIds.filter(id=>id!==p.id));db.people=db.people.filter(x=>x.id!==p.id);selectedPerson='';if(persist())render()}break;}case 'deleteMoment':{if(confirm('Delete this moment?')){db.moments=db.moments.filter(m=>m.id!==selectedMoment);db.reminders=db.reminders.filter(r=>r.momentId!==selectedMoment);db.statusHistory.forEach(h=>{if(h.momentId===selectedMoment){h.momentId='';h.source='deleted-moment';}});selectedMoment='';if(persist())render()}break;}case 'closeModal':document.getElementById('modalRoot').innerHTML='';break;case 'export':exportObject(db,'fondly-backup-'+localDate()+'.json');break;case 'exportV2':{let original=localStorage.getItem(PRE_V3_KEY);if(original)exportObject(original,'fondly-original-v02-'+localDate()+'.json');break;}case 'exportOld':{let original=localStorage.getItem(PRE_V2_KEY);if(original)exportObject(original,'fondly-original-v01-'+localDate()+'.json');break;}case 'exportRaw':exportObject(rawOnError,'fondly-unreadable-original-'+localDate()+'.json');break;case 'import':document.getElementById('importFile').click();break;case 'clear':{if(prompt('This deletes all records in this browser. Export first. Type DELETE to confirm:')==='DELETE'){try{localStorage.removeItem(KEY);localStorage.removeItem(PRE_V2_KEY);localStorage.removeItem(PRE_V3_KEY);loadError='';rawOnError='';db=blank();tab='home';selectedPerson='';selectedMoment='';selectedCircle='';selectedEvent='';mode='';msg('Local records deleted.')}catch(err){alert('Could not clear records: '+err.message)}}break;}}}
